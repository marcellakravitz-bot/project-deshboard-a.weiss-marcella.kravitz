<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>A. Weiss · By Room</title>
<!-- By Room — the page a QR code or a link opens. View only, no sign-in: the project key in the link is the key.
     Shows only what the administrator published. byroom build 3 · 25.10.2026 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #17181c; --accent: #17181c; --accent-ink: #000000; --accent-soft: #eceef1; }
  html, body, #root { margin: 0; height: 100%; background: #f6f6f7; }
  #boot { font-family: 'Assistant', system-ui, sans-serif; color: #5b5e66; padding: 40px 20px; text-align: center; font-size: 17px; }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react"
  }
}
</script>
</head>
<body>
<div id="root"><div id="boot">טוען…</div></div>
<script type="module">
import React from "react";
import { createRoot } from "react-dom/client";
import { ByRoomViewer, publicApi } from "./view.js";
import { BYROOM_FUNCTIONS } from "./config.js";

const p = new URLSearchParams(location.search);
const k = p.get("k") || "";
if (!k) document.getElementById("boot").textContent = "חסר מפתח פרויקט בקישור.";
else createRoot(document.getElementById("root")).render(React.createElement(ByRoomViewer, {
  api: publicApi(BYROOM_FUNCTIONS, k),
  initialFloor: p.get("f") || null,      // a room QR opens straight on its floor plan with the room open
  initialRoom: p.get("r") || null,
}));
</script>
</body>
</html>
