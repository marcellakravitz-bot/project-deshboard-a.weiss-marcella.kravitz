<body>
<!-- 06.11.26 — the one entry link for every app user: phone and code, then the
     project; from there each kind of user goes to the app of its own. -->
<div class="bar">
  <img src="logo.png" alt="A. Weiss" class="logo">
  <button id="out" class="outBtn" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4h3a2 2 0 0 1 2 2v14M2 20h3M13 20h9M10 12v.01M13 4.562v16.157a1 1 0 0 1-1.242.97L5 20V5.562a2 2 0 0 1 1.515-1.94l4-1A2 2 0 0 1 13 4.561Z"/></svg><span>יציאה</span></button>
</div>
<div class="pvBadge">תצוגה מקדימה · נתונים חיים · שינויים לא נשמרים</div>
<main id="app" class="wrap"></main>
<footer class="siteFooter" dir="ltr">Marcella Kravitz © <span class="buildStamp">build 61</span></footer>

<script src="common/core.js?v=61"></script>
<script>
(function(){
var E=AW.esc, S=AW.state, PREVIEW=AW.PREVIEW;
var app=document.getElementById("app"), out=document.getElementById("out");
var PUSH_KEY="awsub.push", PUSH_ASKED="awsub.pushAsked", TOKEN_KEY=AW.TOKEN_KEY;
var q=new URLSearchParams(location.search);

// ------------------------------------------------------------------- push
function pushReady(){ try { return localStorage.getItem(PUSH_KEY)==="1"; } catch(e){ return false; } }
function urlB64(s){
  var pad=(s+"=".repeat((4-s.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/");
  var raw=atob(pad), o=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) o[i]=raw.charCodeAt(i);
  return o;
}
function askPush(loud){
  var say=function(m){ if(loud) alert(m); };
  if(!("serviceWorker" in navigator)||!("PushManager" in window)){
    say("המכשיר הזה לא תומך בהתראות. באייפון צריך להוסיף את האתר למסך הבית ולפתוח משם."); return;
  }
  if(Notification.permission==="denied"){ say("ההתראות חסומות בהגדרות הטלפון עבור האתר הזה. צריך לאפשר אותן שם."); return; }
  navigator.serviceWorker.register("sw.js").then(function(reg){
    return AW.call({action:"vapid"}).then(function(r){
      var key=r.data&&r.data.key;
      if(!key){ say("השרת לא הגדיר מפתח התראות."); return; }
      return Notification.requestPermission().then(function(perm){
        if(perm!=="granted"){ say("לא ניתן אישור להתראות."); return; }
        return reg.pushManager.getSubscription().then(function(ex){
          return ex || reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlB64(key) });
        }).then(function(sub){
          return AW.call({action:"subscribe", subscription:sub.toJSON()}).then(function(res){
            if(!res.ok){ say("הרישום בשרת נכשל."); return; }
            try { localStorage.setItem(PUSH_KEY,"1"); } catch(e){}
            say("ההתראות הופעלו."); picker();
          });
        });
      });
    });
  }).catch(function(e){ say("ההפעלה נכשלה: "+e); });
}
function turnPushOff(){
  try { localStorage.removeItem(PUSH_KEY); } catch(e){}
  if("serviceWorker" in navigator){
    navigator.serviceWorker.ready.then(function(reg){
      return reg.pushManager.getSubscription().then(function(sub){
        if(!sub) return; var ep=sub.endpoint;
        return sub.unsubscribe().then(function(){ return AW.call({action:"unsubscribe", endpoint:ep}); });
      });
    }).catch(function(){});
  }
  picker();
}
function maybeOfferPush(){
  if(PREVIEW||pushReady()) return;
  try { if(localStorage.getItem(PUSH_ASKED)==="1") return; } catch(e){}
  var box=document.createElement("div"); box.className="sheet";
  box.innerHTML='<div class="sheetCard"><h3>התראות לטלפון</h3><p>נודיע לכם כשעולה עדכון חדש בפרויקט, גם כשהאפליקציה סגורה.</p>'+
    '<button class="go" id="pushYes">הפעלת התראות</button><button class="go ghost" id="pushNo">לא עכשיו</button></div>';
  document.body.appendChild(box);
  var close=function(){ try { localStorage.setItem(PUSH_ASKED,"1"); } catch(e){} box.remove(); };
  box.querySelector("#pushNo").onclick=close;
  box.querySelector("#pushYes").onclick=function(){ close(); askPush(true); };
}

// ------------------------------------------------------------------ login
function login(err){
  out.hidden=true;
  app.innerHTML='<div class="card">'+
    '<div class="field"><label for="ph">מספר טלפון</label><input id="ph" class="num" type="tel" inputmode="tel" autocomplete="tel" placeholder="050-0000000"></div>'+
    '<div class="field"><label for="cd">קוד</label><input id="cd" class="num" type="tel" inputmode="numeric" maxlength="6" placeholder="XXXX"></div>'+
    '<button class="go" id="in">כניסה</button>'+
    '<p class="err" id="e"'+(err?'':' hidden')+'>'+E(err||"")+'</p>'+
    '<p class="hint">בכניסה הראשונה — הקוד הזמני שקיבלתם ממנהלת הפרויקט. אחר כך — הקוד שבחרתם.</p></div>';
  var ph=document.getElementById("ph"), cd=document.getElementById("cd"), btn=document.getElementById("in");
  btn.onclick=function(){
    if(!ph.value.trim()||!cd.value.trim()){ login("צריך מספר טלפון וקוד."); return; }
    btn.disabled=true; btn.textContent="בודק…";
    AW.call({action:"login", phone:ph.value, code:cd.value, token:""}).then(function(r){
      if(!r.ok||!r.data.token){
        login((r.data&&r.data.error==="invalid") ? "המספר או הקוד לא נמצאו. בדקו מול מנהלת הפרויקט." : "השרת לא זמין כרגע.");
        return;
      }
      S.token=r.data.token; S.projects=r.data.projects||[];
      try{ localStorage.setItem(TOKEN_KEY,S.token); localStorage.setItem(TOKEN_KEY+".projects",JSON.stringify(S.projects)); }catch(e){}
      if(!r.data.hasPin){ choosePin(); return; }
      picker();
    }).catch(function(){ login("אין חיבור לשרת. נסו שוב."); });
  };
}
// The temporary code is six characters of nothing memorable; once in, each
// person picks four digits of his own.
function choosePin(err){
  out.hidden=false;
  app.innerHTML='<div class="card"><p class="hint" style="margin:0 0 12px">בחרו קוד בן 4 ספרות לכניסות הבאות.</p>'+
    '<div class="field"><label for="p1">קוד</label><input id="p1" class="num" type="tel" inputmode="numeric" maxlength="4" placeholder="••••"></div>'+
    '<div class="field"><label for="p2">שוב, לאימות</label><input id="p2" class="num" type="tel" inputmode="numeric" maxlength="4" placeholder="••••"></div>'+
    '<button class="go" id="sp">שמירה</button><p class="err" id="pe"'+(err?'':' hidden')+'>'+E(err||"")+'</p></div>';
  var btn=document.getElementById("sp");
  btn.onclick=function(){
    var a=document.getElementById("p1").value.trim(), b=document.getElementById("p2").value.trim();
    if(!/^\d{4}$/.test(a)){ choosePin("צריך בדיוק 4 ספרות."); return; }
    if(a!==b){ choosePin("שני הקודים אינם זהים."); return; }
    btn.disabled=true; btn.textContent="שומר…";
    AW.call({action:"set-pin", pin:a}).then(function(r){
      if(!r.ok){ choosePin("השמירה נכשלה. נסו שוב."); return; }
      picker();
    }).catch(function(){ choosePin("אין חיבור לשרת."); });
  };
}

// ---------------------------------------------------------------- projects
function roleLine(p){
  var role=p.role||(p.isPm?"pm":"sub");
  return role==="sub" ? "קבלן - "+AW.tradeHe(p.trade) : AW.ROLE_HE[role]||"";
}
function open(p){
  var role=p.role||(p.isPm?"pm":"sub");
  var dir=AW.APP_DIR[role]||"app-sub";
  var url=dir+"/?p="+encodeURIComponent(p.id);
  if(PREVIEW) url+="&preview="+encodeURIComponent(PREVIEW.who);
  location.href=url;
}
function picker(){
  // 14.11.26 — came here from a notification before signing in: on to it.
  if(!PREVIEW){ var after=AW.takeAfter(S.projects); if(after){ location.href=after; return; } }
  out.hidden=!!PREVIEW;
  var list=S.projects||[];
  // One line at the top when every project is the same role (a subcontractor
  // sees "קבלן - אינסטלציה"); otherwise each project says it.
  var lines=list.map(roleLine), same=lines.length && lines.every(function(x){ return x===lines[0]; });
  var top=PREVIEW ? '<p class="roleHead">תצוגה כ'+(PREVIEW.who==="client"?"פיקוח, לקוח ואדריכלים":E(AW.ROLE_HE[PREVIEW.who]||""))+(PREVIEW.who==="sub"?" (חשמל)":"")+'</p>'
    : (same ? '<p class="roleHead">'+E(lines[0])+'</p>' : '');
  app.innerHTML=(PREVIEW?'':'<div class="pushSwitch"><span>התראות לטלפון</span><button class="tgl'+(pushReady()?" on":"")+'" id="pushTgl" aria-label="התראות"><span></span></button></div>')+
    top+'<p class="lead">בחרו פרויקט</p>'+
    (list.length?'<div class="grid">'+list.map(function(p,i){
      return '<button class="pcube" data-i="'+i+'">'+(p.logo?'<img src="'+E(p.logo)+'" alt="">':'')+
        '<span class="t">'+E(p.name||"פרויקט")+'</span>'+(p.floors?'<span class="f">'+E(p.floors)+'</span>':'')+
        (p.dates?'<span class="dt num">'+E(p.dates)+'</span>':'')+
        (!same&&!PREVIEW?'<span class="dt">'+E(roleLine(p))+'</span>':'')+'</button>';
    }).join("")+'</div>':AW.empty("לא שויך לכם פרויקט פעיל."));
  Array.prototype.forEach.call(app.querySelectorAll(".pcube"), function(b){
    b.onclick=function(){ open(list[Number(b.getAttribute("data-i"))]); };
  });
  var tg=document.getElementById("pushTgl");
  if(tg) tg.onclick=function(){ if(pushReady()) turnPushOff(); else askPush(true); };
  maybeOfferPush();
}
function signOut(msg){
  try{ localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(TOKEN_KEY+".projects"); }catch(e){}
  S.token=null; S.projects=[]; login(msg);
}
out.onclick=function(){ signOut(); };

// ------------------------------------------------------------------- start
if(PREVIEW){
  document.body.classList.add("isPv");
  S.token="preview";
  AW.busy("טוען פרויקטים…");
  AW.call({action:"projects"}).then(function(r){
    if(!r.ok){ AW.retry(r.status===401?"התצוגה המקדימה זמינה רק כשמחוברים לדשבורד כמנהלת.":"השרת לא זמין כרגע."); return; }
    S.projects=r.data.projects||[]; picker();
  }).catch(function(){ AW.retry("אין חיבור לרשת."); });
  return;
}
if(q.get("msg")){ login(q.get("msg")); return; }
var t=null;
try{ t=localStorage.getItem(TOKEN_KEY); }catch(e){}
if(!t){ login(); return; }
S.token=t;
try{ S.projects=JSON.parse(localStorage.getItem(TOKEN_KEY+".projects")||"[]"); }catch(e){ S.projects=[]; }
AW.busy("טוען…");
AW.call({action:"projects"}).then(function(r){
  if(r.ok&&r.data.projects){
    S.projects=r.data.projects;
    try{ localStorage.setItem(TOKEN_KEY+".projects",JSON.stringify(S.projects)); }catch(e){}
  } else if(r.status===401){
    signOut((r.data&&r.data.error)==="bad-token" ? "ההתחברות השמורה לא זוהתה. התחברו שוב." : "ההרשאה כבר לא בתוקף. פנו למנהלת הפרויקט."); return;
  }
  picker();
}).catch(function(){ picker(); });
})();
</script>
