<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>קבלני משנה · א. וייס הנדסה</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17181c; --steel:#5b5e66; --mist:#9a9da5;
    --line:#e6e6e9; --surface:#ffffff; --bg:#f6f6f7;
    --panel:#101114; --helmet:#e8b10a; --ok:#1a7f4b; --navy:#103460; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{overflow-x:hidden;max-width:100%}
  img,table,textarea,input,select{max-width:100%}
  .rec p,.tt td,.tkTop .d,.tkUp,.rjVal{overflow-wrap:anywhere}
  .chips.trades{justify-content:flex-start;margin-bottom:10px}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Assistant','Inter',sans-serif;-webkit-text-size-adjust:100%}
  .num{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
  .bar{position:sticky;top:0;z-index:5;background:var(--panel);color:#fff;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;
    justify-content:center;min-height:52px}
  .bar h1{margin:0;font-size:15px;font-weight:800;letter-spacing:.01em;text-align:center}
  .bar.guest{justify-content:flex-start}
  .bar.guest h1{margin-inline-start:0}
  .bar .side{position:absolute;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:8px}
  .bar .left{left:16px}
  .bar .right{right:16px}
  .bar button{background:none;border:none;color:#b9bcc4;font:inherit;font-size:13px;cursor:pointer;padding:4px}
  .wrap{padding:16px;max-width:560px;margin:0 auto;position:relative}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}
  input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);
    border-radius:10px;background:#fff}
  input:focus-visible,button:focus-visible,.cube:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
  .field+.field{margin-top:14px}
  .go{width:100%;margin-top:18px;padding:13px;border:none;border-radius:999px;background:var(--panel);
    color:#fff;font:inherit;font-weight:800;font-size:15px;cursor:pointer}
  .go[disabled]{background:#c3c6cc}
  .hint{margin:14px 2px 0;font-size:12.5px;color:var(--steel);line-height:1.7;text-align:center}
  .err{margin:12px 0 0;font-size:13px;color:#c0392b}
  .proj{display:flex;flex-direction:column;align-items:center;gap:2px;margin:2px 0 18px;text-align:center}
  .proj img{max-width:150px;max-height:56px;width:auto;height:auto;margin-bottom:8px}
  .proj .pn{font-size:16px;font-weight:800}
  .proj .pf{font-size:13.5px;font-weight:700}
  .proj .pd{font-size:12.5px;color:var(--steel)}
  .proj .ptr{margin-top:6px;font-size:14px;font-weight:800;color:var(--navy)}
  .pushSwitch{display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:16px;font-size:13.5px;font-weight:700;color:var(--navy)}
  .pushSwitch .tiny{border:1px solid var(--line);background:transparent;border-radius:999px;
    padding:3px 10px;font:inherit;font-size:11px;font-weight:700;color:var(--steel);cursor:pointer}
  .tgl{width:46px;height:27px;border-radius:999px;border:none;background:#c9ced6;
    position:relative;cursor:pointer;padding:0;transition:background .18s}
  .tgl span{position:absolute;top:3px;inset-inline-start:3px;width:21px;height:21px;
    border-radius:50%;background:#fff;transition:transform .18s}
  .tgl.on{background:var(--navy)}
  .tgl.on span{transform:translateX(-19px)}
  .docFrame{width:100%;height:calc(100vh - 150px);border:1px solid var(--line);
    border-radius:var(--radius);background:#fff}
  .backArrow{position:absolute;top:14px;right:14px;
    z-index:6;width:38px;height:38px;border:1px solid var(--line);border-radius:12px;
    background:var(--surface);color:var(--steel);display:flex;align-items:center;
    justify-content:center;cursor:pointer;padding:0}
  .backArrow svg{transform:scaleX(-1)}
  .sheet{position:fixed;inset:0;z-index:20;background:rgba(17,18,20,.45);
    display:flex;align-items:flex-end;justify-content:center}
  .sheetCard{background:var(--surface);width:100%;max-width:460px;
    border-radius:18px 18px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 20px);
    text-align:center}
  .sheetCard h3{margin:0 0 8px;font-size:17px}
  .sheetCard p{margin:0 0 18px;font-size:13.5px;color:var(--steel);line-height:1.7}
  .sheetCard .go{margin-top:8px}
  .sheetCard .go.ghost{background:transparent;color:var(--steel);font-weight:600}
  .navBtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;
    padding:7px 14px;font:inherit;font-size:12.5px;font-weight:700;color:var(--steel);cursor:pointer}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .pcube{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    text-align:center;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:18px 14px;min-height:126px;font:inherit;cursor:pointer}
  .pcube img{max-width:110px;max-height:44px;width:auto;height:auto}
  .pcube .t{font-weight:800;font-size:14.5px;color:var(--navy)}
  .pcube .s{font-size:11.5px;color:var(--navy);opacity:.62}
  /* 06.11.26 — a project as the dashboard shows it: the client's logo, the
     name, the floors and the dates. */
  .pcube img{max-width:120px;max-height:52px;margin-bottom:4px}
  .pcube .t{font-size:15px;letter-spacing:.02em;text-transform:uppercase;color:#2b4e95}
  .pcube .f{font-size:13px;font-weight:800;color:var(--ink);margin-top:-4px}
  .pcube .dt{font-size:10.5px;color:var(--steel);margin-top:-6px;white-space:nowrap;letter-spacing:-.01em}
  .grid .pcube{padding-inline:8px}
  .proj .pn{text-transform:uppercase;letter-spacing:.02em;color:#2b4e95}
  .lead{margin:2px 2px 14px;text-align:center;font-size:13.5px;color:var(--steel)}
  .rec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:12px}
  .recTop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
  .recTop .num{font-size:12px;color:var(--mist)}
  .rec p{margin:8px 0 0;font-size:13.5px;line-height:1.75;white-space:pre-wrap}
  .rec .stamp{margin-top:10px;font-size:11px;color:var(--mist);font-weight:500}
  .wkNav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px;
    font-size:14px;font-weight:800;color:var(--navy)}
  .wkNav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;
    width:36px;height:36px;font-size:18px;color:var(--steel);cursor:pointer}
  .wkDay{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:10px}
  .wkHead{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;
    font-size:13.5px;color:var(--navy);margin-bottom:8px}
  .wkHead .num{font-size:11.5px;color:var(--mist);font-weight:600}
  .wkDay textarea{width:100%;min-height:72px;font:inherit;font-size:16px;padding:9px;
    border:1px solid var(--line);border-radius:10px;background:#fff;resize:vertical}
  .writeBar{display:flex;justify-content:center;margin-bottom:14px}
  .writeBar button[disabled]{background:#c3c6cc;cursor:default}
  .writeBar button{border:none;border-radius:999px;background:var(--panel);color:#fff;
    font:inherit;font-weight:800;font-size:14px;padding:11px 22px;cursor:pointer}
  .form{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px}
  .form textarea,.form input{width:100%;font:inherit;font-size:16px;padding:10px;
    border:1px solid var(--line);border-radius:10px;background:#fff}
  .form textarea{min-height:110px;resize:vertical}
  .form .row{display:flex;gap:10px}
  .form .row button{flex:1;border:none;border-radius:999px;padding:12px;font:inherit;
    font-weight:800;font-size:15px;color:#fff;background:var(--panel);cursor:pointer}
  .form .row button.ghost{background:#9aa3af}
  .shots{display:flex;flex-wrap:wrap;gap:8px}
  .shots img{width:74px;height:74px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .shots label{width:74px;height:74px;border:1px dashed var(--line);border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--mist);cursor:pointer}
  /* 03.11.26 — rejects */
  .rjBtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:0 0 14px;
    border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:14px;
    font:inherit;font-weight:800;font-size:15px;color:var(--navy);cursor:pointer}
  .rjRow{display:block;width:100%;text-align:right;font:inherit;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;cursor:pointer;color:inherit}
  .rjRow.ok{background:#e3f3e6;border-color:#9fd3ae}
  .rjRow .n{font-weight:800;color:var(--steel);margin-left:6px}
  .rjRow .meta{font-size:12px;color:var(--mist);margin-top:4px}
  .rjInfo{font-size:12.5px;color:var(--steel);text-align:center;margin:-6px 0 12px}
  .rjField{font-size:12px;font-weight:800;color:var(--steel);margin:10px 0 2px}
  .rjVal{font-size:14.5px;line-height:1.6;white-space:pre-wrap}
  .rjNote{font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .rjNote b{color:var(--steel);direction:ltr;unicode-bidi:isolate;margin-left:6px}
  .rjDone{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
  .rjDone input{width:22px;height:22px;accent-color:#1f7a3e}
  .files{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .file{display:flex;align-items:center;justify-content:center;width:88px;height:88px;
    border:1px solid var(--line);border-radius:10px;background:#f7f8fa;overflow:hidden;
    font-size:11px;color:var(--steel);text-align:center;padding:6px;text-decoration:none;word-break:break-all}
  .file.img{padding:0}
  .file img{width:100%;height:100%;object-fit:cover}
  .tbl{width:100%;border-collapse:collapse;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .tbl th,.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);font-size:12.5px;text-align:center;white-space:pre-line}
  .tbl thead th{background:#f4f6f9;font-weight:800;font-size:12px}
  .tbl td:nth-child(2){text-align:right}
  .tbl tr:last-child td{border-bottom:none}
  .week th{width:92px;background:#f4f6f9;font-weight:800;text-align:center}
  .week th .num{display:block;font-size:10.5px;color:var(--mist);font-weight:600}
  .week td{text-align:right;white-space:pre-wrap;line-height:1.7}
  .cats{display:flex;flex-direction:column;gap:10px}
  .catsBack{display:flex;justify-content:flex-start;margin:0 0 12px}
  .catRow{display:flex;justify-content:space-between;align-items:center;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;font:inherit;
    font-size:14px;font-weight:800;color:var(--navy);cursor:pointer}
  .catRow .n{font-size:11.5px;font-weight:600;color:var(--mist)}
  .allCats{display:block;width:auto;text-align:start;margin:0;padding:4px 0}
  .checks{display:flex;flex-direction:column;gap:8px}
  .chk{display:flex;align-items:center;gap:10px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;font-size:13.5px}
  .chk{flex-wrap:wrap}
  .chk .box{flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}
  .chk .txt{flex:1}
  .chk .dt{display:block;font-size:11px;color:var(--mist);font-weight:600;margin-top:2px}
  .chk .ic{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;border:none;background:transparent;color:var(--steel);cursor:pointer;padding:0}
  .chk .ic.off{color:#d3d6dc;cursor:default}
  .chk .noteBox{flex:0 0 100%;margin-top:8px;background:#f7f8fa;border:1px solid var(--line);
    border-radius:8px;padding:10px;font-size:13px;line-height:1.7;white-space:pre-wrap}
  .chk.done .box{background:var(--ok);border-color:var(--ok)}
  .chk.late{background:#fbe3e3;border-color:#f0c9c9}
  .chk.done .txt{color:var(--ok);font-weight:700}
  .eye{display:inline-flex;color:var(--steel)}
  .eye.off{color:#c9ced6}
  .cube{display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;
    text-align:center;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px 14px;min-height:112px;font:inherit;cursor:pointer}
  .cube{position:relative}
  .cube:active{background:#fbfbfc}
  .cube.pv{outline:2px solid #1A559E;outline-offset:-2px}
  /* New since this phone last looked. It pulses for a few seconds and then
     settles: something that blinks for ever stops being read as a signal. */
  .cube.fresh{border-color:#b9cbe4}
  .cube .dot{position:absolute;top:10px;inset-inline-end:10px;width:10px;height:10px;
    border-radius:50%;background:var(--navy);box-shadow:0 0 0 0 rgba(16,52,96,.45);
    animation:pulse 1.8s ease-out 4}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(16,52,96,.45)}
    70%{box-shadow:0 0 0 9px rgba(16,52,96,0)}
    100%{box-shadow:0 0 0 0 rgba(16,52,96,0)}
  }
  @media (prefers-reduced-motion: reduce){ .cube .dot{animation:none} }
  .cube .ico{width:34px;height:34px;border-radius:10px;background:#eef2f7;display:flex;
    align-items:center;justify-content:center;color:var(--navy)}
  .cube .t{font-weight:800;font-size:14.5px;color:var(--navy)}
  .cube .s{font-size:11.5px;color:var(--navy);opacity:.62;margin-top:-6px}
  .cube .dot{position:absolute}
  .head{position:relative;display:flex;align-items:center;justify-content:center;
    min-height:34px;margin:2px 2px 16px}
  .head h2{margin:0;font-size:16px;font-weight:800}
  .back{position:absolute;inset-inline-start:0;top:50%;transform:translateY(-50%);
    background:none;border:none;font:inherit;font-size:14px;color:var(--steel);cursor:pointer;padding:4px}
  .empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);
    padding:26px 18px;text-align:center;color:var(--steel);font-size:13.5px;line-height:1.8}
  .foot{padding:26px 16px calc(env(safe-area-inset-bottom) + 20px);text-align:center;
    font-size:11px;color:var(--mist)}
  .logo{height:30px;width:auto;display:block}
  .siteFooter{text-align:center;padding:9px 24px calc(env(safe-area-inset-bottom) + 16px);
    font-size:11.5px;color:var(--mist);font-weight:500}
  /* 06.11.26 — the home screen: the week first, then the long buttons, then
     a row of four icons she picks in the dashboard. */
  .outBtn{display:inline-flex;align-items:center;gap:6px;color:#e3e5ea!important;font-weight:700!important}
  .wkCard{display:block;width:100%;text-align:right;font:inherit;color:inherit;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 6px;margin:0 0 12px;cursor:pointer;position:relative}
  .wkCard .wh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .wkCard .wh b{font-size:15px;color:var(--navy);display:flex;align-items:center;gap:8px}
  .wkCard .wh .num{font-size:11.5px;color:var(--mist);font-weight:600}
  .tt{width:100%;border-collapse:separate;border-spacing:0 4px}
  .tt th{width:74px;font-size:12px;font-weight:800;color:var(--navy);text-align:right;vertical-align:top;
    padding:7px 8px;background:#f2f5f9;border-radius:0 8px 8px 0}
  .tt th .num{display:block;font-size:10.5px;color:var(--mist);font-weight:600}
  .tt td{font-size:12.5px;line-height:1.55;padding:7px 9px;background:#fafbfc;border-radius:8px 0 0 8px;
    white-space:pre-wrap;vertical-align:top;color:var(--ink)}
  .tt td.none{color:#c3c6cc}
  .tt tr.today th{background:var(--navy);color:#fff}
  .tt tr.today th .num{color:#cfd8e6}
  .tt tr.today td{background:#eaf0f8}
  .longBtn{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 10px;border:1px solid var(--line);
    background:var(--surface);border-radius:var(--radius);padding:14px 16px;font:inherit;font-weight:800;font-size:15px;
    color:var(--navy);cursor:pointer;position:relative;text-align:right}
  .longBtn .ico{width:34px;height:34px;border-radius:10px;background:#eef2f7;display:flex;align-items:center;justify-content:center;flex:none}
  .longBtn .t{flex:1}
  .longBtn .n{font-size:12px;color:var(--mist);font-weight:700}
  .longBtn .car{color:var(--mist);transform:scaleX(-1);display:flex}
  .longBtn .dot,.iconBtn .dot{position:absolute;top:9px;inset-inline-end:9px;width:9px;height:9px;border-radius:50%;background:var(--navy)}
  .iconRow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
  .iconBtn{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
    background:var(--surface);border:1px solid var(--line);border-radius:16px;color:var(--navy);cursor:pointer;padding:0}
  .iconBtn svg{width:26px;height:26px}
  .iconBtn:active,.longBtn:active,.wkCard:active{background:#fbfbfc}
  /* 06.11.26 — the dashboard's live preview */
  .pvBadge{display:none}
  body.isPv .pvBadge{display:block;position:sticky;top:52px;z-index:4;background:#fff7d6;color:#7a5a00;
    text-align:center;font-size:11.5px;font-weight:800;padding:5px 10px;border-bottom:1px solid #f0dc96}
  .pvToast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;background:#17181c;color:#fff;
    font-size:13px;font-weight:700;padding:9px 16px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25);
    max-width:calc(100% - 32px);text-align:center}
  /* 06.11.26 — ניהול משימות (project managers) */
  .tkTools{display:flex;gap:8px;justify-content:center;margin:0 0 12px;flex-wrap:wrap}
  .tkTools button{border:none;border-radius:999px;background:var(--panel);color:#fff;font:inherit;font-weight:800;
    font-size:14px;padding:11px 20px;cursor:pointer}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;
    font:inherit;font-size:12.5px;font-weight:700;color:var(--steel);cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .tkGrp{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
  .tkGrpH{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:none;
    padding:13px 14px;font:inherit;font-size:14.5px;font-weight:800;color:var(--navy);cursor:pointer;text-align:right}
  .tkGrpH .n{font-size:11.5px;font-weight:700;color:var(--mist);white-space:nowrap}
  .tkGrpH .car{color:var(--mist);transition:transform .15s}
  .tkGrp.open .tkGrpH .car{transform:rotate(90deg)}
  .tk{border-top:1px solid var(--line);padding:11px 14px}
  .tkTop{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
  .tkTop .d{flex:1;font-size:14px;font-weight:700;line-height:1.55;white-space:pre-wrap}
  .stp{flex:0 0 auto;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:800;white-space:nowrap}
  .tkMeta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:11.5px;color:var(--steel)}
  .tkMeta .late{color:#c0392b;font-weight:800}

// Notifications. Asked for once, after the code is set — never on the very
// first screen, where a permission prompt reads as an ambush. On an iPhone this
// only works at all once the site has been added to the home screen, so a
// refusal there is expected and is not treated as an error. (11.9.26)
var PUSH_KEY="awsub.push";
var PUSH_ASKED="awsub.pushAsked";
// Asked once, over the board, and never again — an offer that returns on every
// visit is an offer nobody reads. Declining leaves the app working exactly as
// before, with the blue dot doing the telling. (11.9.26)
function maybeOfferPush(){
  if(pushReady()) return;
  try { if(localStorage.getItem(PUSH_ASKED)==="1") return; } catch(e){}
  var box=document.createElement("div");
  box.className="sheet";
  box.innerHTML='<div class="sheetCard">'+
    '<h3>התראות לטלפון</h3>'+

    '<button class="go" id="pushYes">הפעלת התראות</button>'+
    '<button class="go ghost" id="pushNo">לא עכשיו</button></div>';
  document.body.appendChild(box);
  var close=function(){
    try { localStorage.setItem(PUSH_ASKED,"1"); } catch(e){}
    box.remove();
  };
  box.querySelector("#pushNo").onclick=close;
  box.querySelector("#pushYes").onclick=function(){ close(); askPush(true); };
}
function pushReady(){
  try { return localStorage.getItem(PUSH_KEY)==="1"; } catch(e){ return false; }
}
// Why this can refuse, in the order it usually does: an iPhone in a browser tab
// has no push at all until the site is on the home screen; permission may have
// been denied once and is then never asked again; and a device that agreed
// still has to hand its address to the server. Each of those says so out loud
// now, because "nothing happened" told us nothing. (11.9.26)
function askPush(loud){
  var say=function(m){ if(loud) alert(m); else console.log("[push] "+m); };
  if(!("serviceWorker" in navigator)||!("PushManager" in window)){
    say("המכשיר הזה לא תומך בהתראות. באייפון צריך להוסיף את האתר למסך הבית ולפתוח משם.");
    return;
  }
  if(Notification.permission==="denied"){
    say("ההתראות חסומות בהגדרות הטלפון עבור האתר הזה. צריך לאפשר אותן שם.");
    return;
  }
  navigator.serviceWorker.register("sw.js").then(function(reg){
    return call({action:"vapid"}).then(function(r){
      var key=r.data&&r.data.key;
      if(!key){ say("השרת לא הגדיר מפתח התראות."); return; }
      return Notification.requestPermission().then(function(perm){
        if(perm!=="granted"){ say("לא ניתן אישור להתראות."); return; }
        return reg.pushManager.getSubscription().then(function(existing){
          return existing || reg.pushManager.subscribe({
            userVisibleOnly:true,
            applicationServerKey:urlB64(key)
          });
        }).then(function(sub){
          return call({action:"subscribe", token:state.token,
            projectId:state.project, subscription:sub.toJSON()}).then(function(res){
            if(!res.ok){ say("הרישום בשרת נכשל. "+((res.data&&res.data.detail)||"")); return; }
            try { localStorage.setItem(PUSH_KEY,"1"); } catch(e){}
            say("ההתראות הופעלו.");
            render();
          });
        });
      });
    });
  }).catch(function(e){ say("ההפעלה נכשלה: "+e); });
}
function urlB64(s){
  var pad=(s+"=".repeat((4-s.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/");
  var raw=atob(pad), out=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
  return out;
}
function seenAll(){
  try { return JSON.parse(localStorage.getItem(SEEN_KEY)||"{}"); } catch(e){ return {}; }
}
function seenKey(k){
  return (state.project||"")+"|"+(state.trade||(state.board&&state.board.trade)||"")+"|"+k;
}
function isNew(k){

  if(!marks[k]) return false;
  return seenAll()[seenKey(k)]!==marks[k];
}
function markAllSeen(){
  var marks=(state.board&&state.board.marks)||{};
  var all=seenAll();
  Object.keys(marks).forEach(function(k){ all[seenKey(k)]=marks[k]; });
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(all)); } catch(e){}
}
function markSeen(k){
  var marks=(state.board&&state.board.marks)||{};
  if(!marks[k]) return;
  var all=seenAll();
  all[seenKey(k)]=marks[k];
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(all)); } catch(e){}
}

function pvToken(){
  try{ var t=window.parent&&window.parent!==window&&window.parent.__awAccessToken; if(t) return t; }catch(e){}
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(!/^sb-.*-auth-token$/.test(k)) continue;
      var v=JSON.parse(localStorage.getItem(k)||"null");
      if(v&&v.access_token) return v.access_token;
      if(v&&v.currentSession&&v.currentSession.access_token) return v.currentSession.access_token;
    }
  }catch(e){}
  return "";
}

    if(r.ok){

// Lists made on the dashboard (or here, by a project manager). A project
// manager sees every list and adds rows, photos and notes; a subcontractor sees
// only the lists shared with him, and reads them. sub-rejects decides which.
function rjCall(body){
  body.token=state.token; body.projectId=state.project;
  var g=pvGuard(body); if(g) return g;
  return fetch(RJ_API,{ method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(body) })
    .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, status:r.status, data:j }; },
      function(){ return { ok:false, status:r.status, data:{} }; }); });
}
function rjCount(){
  state.rjN=null;
  rjCall({action:"lists"}).then(function(r){
    if(!r.ok) return;
    state.rjN=(r.data.lists||[]).length; state.rjPm=!!r.data.isPm;
    if(!state.rj && !state.screen && !state.doc) render();
  }).catch(function(){});
}
function rjEntry(){
  var pm=state.board&&state.board.isPm;
  if(hiddenSet()["rejects"]) return "";
  if(!pm && !state.rjN) return "";
  return '<button class="rjBtn" id="rjGo">'+icon("M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9")+
    'ריג\'קטים'+(state.rjN?' ('+state.rjN+')':'')+'</button>';
}
function rjWire(){
  var g=document.getElementById("rjGo");
  if(g) g.onclick=function(){ history.pushState({s:1},""); state.rj={view:"lists"}; rjLoadLists(); };
}
function rjLoadLists(){
  busy("טוען רשימות…");
  rjCall({action:"lists"}).then(function(r){
    if(!r.ok){ retry("טעינת הרשימות נכשלה."); return; }
    state.rj={view:"lists", lists:r.data.lists||[], isPm:!!r.data.isPm};
    render();
  }).catch(function(){ retry("אין חיבור לרשת."); });
}
function rjLoadList(id, then){
  busy("טוען את הרשימה…");
  rjCall({action:"list", listId:id}).then(function(r){
    if(!r.ok){ retry("טעינת הרשימה נכשלה."); return; }
    var keep=state.rj||{};
    state.rj={view:keep.view==="card"?"card":"list", list:r.data.list, isPm:!!r.data.isPm, rowId:keep.rowId, edit:false};
    if(then) then();
    render();
  }).catch(function(){ retry("אין חיבור לרשת."); });
}
function rjThumb(file){
  return new Promise(function(res){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var sc=Math.min(1,480/Math.max(img.width,img.height)), c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(img.width*sc)); c.height=Math.max(1,Math.round(img.height*sc));
      var g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",0.72));
    };
    img.onerror=function(){ URL.revokeObjectURL(url); res(""); };
    img.src=url;
  });
}
function rjShots(arr){
  if(!arr||!arr.length) return "";
  return '<div class="files">'+arr.map(function(p){
    return p.url ? '<a class="file img" href="'+esc(p.url)+'" target="_blank" rel="noopener"><img src="'+esc(p.thumb)+'" alt=""></a>'
                 : '<span class="file img"><img src="'+esc(p.thumb)+'" alt=""></span>';
  }).join("")+'</div>';
}

// Photographs are shrunk here, before they leave the phone: on site the line
// is thin, and a five-megabyte picture simply never arrives.
function shrink(file){
  return new Promise(function(res){
    if(!file||!/^image\//.test(file.type||"")){ res(null); return; }
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var max=1600, sc=Math.min(1,max/Math.max(img.width,img.height));
      var c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(img.width*sc));
      c.height=Math.max(1,Math.round(img.height*sc));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res({ name:(file.name||"photo")+".jpg", type:"image/jpeg", data:c.toDataURL("image/jpeg",0.82) });
    };
    img.onerror=function(){ URL.revokeObjectURL(url); res(null); };
    img.src=url;
  });
}

function sundayOf(d){
  var x=new Date(d.getTime());
  x.setHours(0,0,0,0);
  x.setDate(x.getDate()-x.getDay());
  return new Date(x.getTime()-x.getTimezoneOffset()*6e4).toISOString().slice(0,10);
}
function shiftWeek(isoDay,weeks){
  var d=new Date(isoDay+"T00:00:00");
  d.setDate(d.getDate()+weeks*7);
  return sundayOf(d);
}
function weekDays(isoDay){
  var names=["ראשון","שני","שלישי","רביעי","חמישי","שישי"];
  var base=new Date(isoDay+"T00:00:00");
  return names.map(function(n,i){
    var d=new Date(base); d.setDate(d.getDate()+i);
    return { name:n, iso:new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10) };
  });
}

  }).sort().reverse();

// What a project manager sees: one week at a time, six boxes, and a save that
// sends only the days he actually changed — so two people filling different
// days of the same week never write over one another.
function viewWeeklyEdit(b){
  if(!weekShown) weekShown=sundayOf(new Date());
  var stored=(b.weekly||{})[weekShown]||[];
  var days=weekDays(weekShown);
  var val=function(i){
    if(weekBuf&&weekBuf[i]!=null) return weekBuf[i];
    return stored[i]||"";
  };
  var dirty=!!weekBuf&&Object.keys(weekBuf).some(function(i){ return (weekBuf[i]||"")!==(stored[i]||""); });
  return '<div class="wkNav"><button id="wkPrev">‹</button>'+
      '<strong>'+esc(fmt(weekShown))+' – '+esc(fmt(days[5].iso))+'</strong>'+
      '<button id="wkNext">›</button></div>'+

        '<textarea data-d="'+i+'" placeholder="עבודות נדרשות">'+esc(val(i))+'</textarea></div>';

function screen(){
  var c=CUBES.filter(function(x){return x.key===state.screen})[0];
  var b=state.board||{};
  var body =
    state.screen==="log"       ? viewLog(b) :
    state.screen==="specs"     ? viewSpecs(b) :
    state.screen==="submittal" ? viewSubmittal(b) :

    state.screen==="standards" ? viewStandards(b) :

  app.innerHTML=projHead(true)+'<div class="head"><button class="back" id="b">→ חזרה</button><h2>'+c.t+'</h2></div>'+body;
  document.getElementById("b").onclick=function(){ history.back(); };

    el.onclick=function(){ state.cat=el.getAttribute("data-c"); history.pushState({s:1},""); render(); };
  });
  var ac=document.getElementById("ac");
  if(ac) ac.onclick=function(){ history.back(); };
  Array.prototype.forEach.call(app.querySelectorAll(".wkDay textarea"), function(t){
    t.oninput=function(){
      weekBuf=weekBuf||{};
      weekBuf[t.getAttribute("data-d")]=t.value;
      var sv=document.getElementById("wkSave");
      if(sv){ sv.disabled=false; sv.textContent="שמירה"; }
    };
  });
  var wp=document.getElementById("wkPrev");
  if(wp) wp.onclick=function(){ weekShown=shiftWeek(weekShown,-1); weekBuf=null; render(); };
  var wn=document.getElementById("wkNext");
  if(wn) wn.onclick=function(){ weekShown=shiftWeek(weekShown,1); weekBuf=null; render(); };
  var ws=document.getElementById("wkSave");
  if(ws) ws.onclick=function(){
    var b=state.board||{};
    var stored=(b.weekly||{})[weekShown]||[];
    var changed=Object.keys(weekBuf||{}).filter(function(i){ return (weekBuf[i]||"")!==(stored[i]||""); });
    if(!changed.length) return;
    ws.disabled=true; ws.textContent="שומר…";
    // One request per day, so a day somebody else touched meanwhile is the
    // only thing that could ever clash.
    var chain=Promise.resolve(), failed=false;
    changed.forEach(function(i){
      chain=chain.then(function(){
        return call({action:"set-week", token:state.token, projectId:state.project,
          trade:state.trade||b.trade, weekStart:weekShown, day:Number(i), text:weekBuf[i]||""})
          .then(function(r){ if(!r.ok) failed=true; });
      });
    });
    chain.then(function(){
      if(failed){ ws.disabled=false; ws.textContent="שמירה"; alert("חלק מהשמירה נכשל."); return; }
      weekBuf=null; loadBoard();
    }).catch(function(){ ws.disabled=false; ws.textContent="שמירה"; alert("אין חיבור."); });
  };
  var nl=document.getElementById("newLog");
  if(nl) nl.onclick=function(){ logDraft={subject:"",body:"",photos:[]}; render(); };
  var lc=document.getElementById("lcancel");
  if(lc) lc.onclick=function(){ logDraft=null; render(); };
  var cam=document.getElementById("lcam");
  if(cam) cam.onchange=function(){
    var f=cam.files&&cam.files[0];
    if(!f) return;
    shrink(f).then(function(ph){
      if(!ph) return;
      logDraft.subject=(document.getElementById("lsub")||{}).value||logDraft.subject;
      logDraft.body=(document.getElementById("ltxt")||{}).value||logDraft.body;
      logDraft.photos.push(ph);
      render();
    });
  };
  var ls=document.getElementById("lsave");
  if(ls) ls.onclick=function(){
    var sub=(document.getElementById("lsub")||{}).value||"";
    var txt=(document.getElementById("ltxt")||{}).value||"";
    if(!sub.trim()){ alert("צריך נושא."); return; }
    ls.disabled=true; ls.textContent="שומר…";
    call({action:"add-log", token:state.token, projectId:state.project,
          trade:state.trade||(state.board&&state.board.trade),
          subject:sub, text:txt, photos:logDraft.photos}).then(function(r){
      if(!r.ok){ ls.disabled=false; ls.textContent="שמירה"; alert("השמירה נכשלה."); return; }
      logDraft=null; loadBoard();
    }).catch(function(){ ls.disabled=false; ls.textContent="שמירה"; alert("אין חיבור."); });
  };
  Array.prototype.forEach.call(app.querySelectorAll("[data-doc]"), function(el){
    el.onclick=function(){ history.pushState({s:1},""); openDoc(el.getAttribute("data-doc")); };
  });
  Array.prototype.forEach.call(app.querySelectorAll(".note"), function(el){
    el.onclick=function(){
      var box=document.getElementById("nb"+el.getAttribute("data-n"));
      if(box) box.hidden=!box.hidden;
    };
  });
}

    if(tkFilter==="open" && (t.status==="done"||t.status==="info")) return false;
    if(tkFilter==="done" && t.status!=="done") return false;
    if(tkFilter==="late" && !tkIsLate(t)) return false;
    return true;
  };
  var keys=(T.cats||[]).map(function(c){ return c.key; });
  var catOf=function(t){ return keys.indexOf(t.category)>=0?t.category:""; };
  var groups=keys.concat([""]).filter(function(k){
    return (tkCat==="all"||tkCat===k) && list.some(function(t){ return catOf(t)===k && pass(t); });
  });
  var withAny=keys.concat([""]).filter(function(k){ return list.some(function(t){ return catOf(t)===k; }); });
  var nOpen=list.filter(function(t){ return t.status!=="done"&&t.status!=="info"; }).length;
  var nLate=list.filter(tkIsLate).length;
  var h=projHead(false)+'<div class="head"><button class="back" id="b">→ חזרה</button><h2>ניהול משימות</h2></div>';
  if(tkDraft) h+=tkNewForm();
  else h+='<div class="tkTools"><button id="tkNew">+ משימה חדשה</button></div>';
  h+='<div class="chips">'+[["open","פתוחות ("+nOpen+")"],["late","באיחור ("+nLate+")"],["done","בוצעו"],["all","הכול"]].map(function(f){
      return '<button class="chip'+(tkFilter===f[0]?" on":"")+'" data-f="'+f[0]+'">'+f[1]+'</button>'; }).join("")+'</div>';
  h+='<div class="chips"><button class="chip'+(tkCat==="all"?" on":"")+'" data-c="all">כל הקטגוריות</button>'+withAny.map(function(k){
      return '<button class="chip'+(tkCat===k?" on":"")+'" data-c="'+esc(k)+'">'+esc(k?tkCatName(k):"ללא קטגוריה")+'</button>'; }).join("")+'</div>';
  if(!groups.length) h+=empty(tkFilter==="open"?"אין משימות פתוחות.":"אין משימות להצגה.");
  groups.forEach(function(k){
    var ts=list.filter(function(t){ return catOf(t)===k && pass(t); });
    var all=list.filter(function(t){ return catOf(t)===k; });
    var done=all.filter(function(t){ return t.status==="done"; }).length;
    var isOpen=tkCat!=="all"||tkGrp[k]||ts.some(function(t){ return t.id===tkOpen; });
    h+='<div class="tkGrp'+(isOpen?" open":"")+'"><button class="tkGrpH" data-g="'+esc(k)+'"><span>'+esc(k?tkCatName(k):"ללא קטגוריה")+'</span>'+
      '<span class="n">'+ts.length+' משימות · <span class="num">'+done+'/'+all.length+'</span> בוצעו <span class="car">‹</span></span></button>'+
      (isOpen?ts.map(tkCard).join(""):"")+'</div>';
  });
  app.innerHTML=h;
  document.getElementById("b").onclick=function(){ history.back(); };
  var nw=document.getElementById("tkNew");
  if(nw) nw.onclick=function(){ tkDraft={category:tkCat!=="all"?tkCat:"",desc:"",owner:"",due:""}; tkOpen=null; render(); };
  var keep=function(){
    if(!tkDraft) return;
    tkDraft.category=(document.getElementById("ndCat")||{}).value||"";
    tkDraft.desc=(document.getElementById("ndDesc")||{}).value||"";
    tkDraft.owner=(document.getElementById("ndOwner")||{}).value||"";
    tkDraft.due=(document.getElementById("ndDue")||{}).value||"";
  };
  var nc=document.getElementById("ndCancel");
  if(nc) nc.onclick=function(){ tkDraft=null; render(); };
  var ns=document.getElementById("ndSave");
  if(ns) ns.onclick=function(){
    keep();
    if(!tkDraft.desc.trim()){ alert("צריך תיאור למשימה."); return; }
    ns.disabled=true; ns.textContent="שומר…";
    call({action:"task-save", op:"add", token:state.token, projectId:state.project, fields:tkDraft}).then(function(r){
      if(!r.ok){ ns.disabled=false; ns.textContent="הוספה"; alert("השמירה נכשלה."); return; }
      var cat=tkDraft.category; tkDraft=null;
      if(r.data&&r.data.task){ tkGrp[cat]=true; tkFilter="open"; }
      tkLoad();
    }).catch(function(){ ns.disabled=false; ns.textContent="הוספה"; alert("אין חיבור."); });
  };
  Array.prototype.forEach.call(app.querySelectorAll(".chip[data-f]"), function(b){
    b.onclick=function(){ keep(); tkFilter=b.getAttribute("data-f"); render(); };
  });
  Array.prototype.forEach.call(app.querySelectorAll(".chip[data-c]"), function(b){
    b.onclick=function(){ keep(); tkCat=b.getAttribute("data-c"); render(); };
  });
  Array.prototype.forEach.call(app.querySelectorAll(".tkGrpH"), function(b){
    b.onclick=function(){ var k=b.getAttribute("data-g"); tkGrp[k]=!tkGrp[k]; if(!tkGrp[k]) tkOpen=null; tkRender(); };
  });
  Array.prototype.forEach.call(app.querySelectorAll("[data-open]"), function(b){
    b.onclick=function(){ var id=b.getAttribute("data-open"); tkOpen=tkOpen===id?null:id; tkRender(); };
  });
  var t=tkOpen&&list.filter(function(x){ return x.id===tkOpen; })[0];
  if(!t) return;
  var save=function(fields, btn, label){
    if(btn){ btn.disabled=true; btn.textContent="שומר…"; }
    return call({action:"task-save", op:"patch", token:state.token, projectId:state.project, taskId:t.id, fields:fields}).then(function(r){
      if(!r.ok){ if(btn){ btn.disabled=false; btn.textContent=label; } alert(r.status===403?"אפשר לערוך רק משימה שהקמת.":"השמירה נכשלה."); return; }
      tkLoad(true).then(function(){ tkRender(); });
    }).catch(function(){ if(btn){ btn.disabled=false; btn.textContent=label; } alert("אין חיבור."); });
  };
  Array.prototype.forEach.call(app.querySelectorAll(".stSeg button"), function(b){
    b.onclick=function(){ var v=b.getAttribute("data-st"); if(v===t.status) return; save({status:v}); };
  });
  var sv=document.getElementById("tkSave");
  if(sv) sv.onclick=function(){
    var f={}, own=t.mine&&!t.fixed;
    var nt=(document.getElementById("tkNotes")||{}).value;
    if(nt!=null && nt!==t.notes) f.notes=nt;
    if(own){
      var dsc=(document.getElementById("tkDesc")||{}).value, ow=(document.getElementById("tkOwner")||{}).value,
          du=(document.getElementById("tkDue")||{}).value, ct=(document.getElementById("tkCatSel")||{}).value;
      if(dsc!=null && dsc.trim() && dsc!==t.desc) f.desc=dsc;
      if(ow!=null && ow!==t.owner) f.owner=ow;
      if(du!=null && du!==t.due) f.due=du;
      if(ct!=null && ct!==t.category) f.category=ct;
    }
    if(!Object.keys(f).length){ pvToast("אין שינויים לשמירה"); return; }
    save(f, sv, "שמירה");
  };
  var cl=document.getElementById("tkClose");
  if(cl) cl.onclick=function(){ tkOpen=null; tkRender(); };
  var ug=document.getElementById("tkUpdGo");
  if(ug) ug.onclick=function(){
    var tx=((document.getElementById("tkUpd")||{}).value||"").trim();
    if(!tx){ alert("צריך לכתוב את העדכון."); return; }
    ug.disabled=true; ug.textContent="שומר…";
    call({action:"task-save", op:"update", token:state.token, projectId:state.project, taskId:t.id, text:tx}).then(function(r){
      if(!r.ok){ ug.disabled=false; ug.textContent="הוספת עדכון"; alert("השמירה נכשלה."); return; }
      tkLoad(true).then(function(){ tkRender(); });
    }).catch(function(){ ug.disabled=false; ug.textContent="הוספת עדכון"; alert("אין חיבור."); });
  };
}
// Redrawn in place: an open card must not throw the list back to the top.
function tkRender(){
  var y=window.scrollY; tkView(); window.scrollTo(0,y);
  if(tkOpen){
    var el=app.querySelector('.tk[data-id="'+(window.CSS&&CSS.escape?CSS.escape(tkOpen):tkOpen)+'"]');
    if(el){ var r=el.getBoundingClientRect(); if(r.top<60||r.top>window.innerHeight-80) el.scrollIntoView({block:"start"}); }
  }
}

// ----------------------------------------------------------- preview (06.11.26)
// The dashboard's "אפליקציות" > תצוגה מקדימה: the real app, on the real
// projects, signed in as the administrator, read only. It asks which project,
// moves between every screen, follows the buttons switched on and off in the
// dashboard at once, and fetches the data again every few seconds so what is
// changed on the dashboard shows here live.
function pvStart(){
  busy("טוען פרויקטים…");
  call({action:"projects", token:"preview"}).then(function(r){
    if(!r.ok){
      app.innerHTML='<div class="card" style="text-align:center"><p class="hint" style="margin:0 0 14px">'+
        (r.status===401?"התצוגה המקדימה זמינה רק כשמחוברים לדשבורד כמנהלת.":"השרת לא זמין כרגע.")+
        '</p><button class="go" id="rt">נסו שוב</button></div>';
      document.getElementById("rt").onclick=pvStart; return;
    }
    state.projects=r.data.projects||[];
    if(PREVIEW.project && state.projects.some(function(p){ return p.id===PREVIEW.project; })){
      state.project=PREVIEW.project; loadBoard(); return;
    }
    render();
  }).catch(function(){ retry("אין חיבור לרשת."); });
}
function pvBusy(){
  var a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
  return !!(logDraft||weekBuf||rjDraft||tkDraft||tkOpen||state.doc);
}
function pvRefresh(force){
  if(!PREVIEW||!state.project||!state.board) return;
  if(!force&&(document.hidden||pvBusy())) return;
  var y=window.scrollY;
  if(state.screen==="tasks"){ tkLoad(true).then(function(ch){ if(ch||force){ tkView(); window.scrollTo(0,y); } }); return; }
  if(state.rj) return;
  call({action:"board", token:state.token, projectId:state.project, trade:state.trade}).then(function(r){
    if(!r.ok) return;
    if(!force&&JSON.stringify(r.data)===JSON.stringify(state.board)) return;
    state.board=r.data;
    if(pvBusy()&&!force) return;
    render(); window.scrollTo(0,y);
  }).catch(function(){});
}
if(PREVIEW){
  setInterval(function(){ pvRefresh(false); }, 12000);
  window.addEventListener("message", function(e){
    if(e.origin!==location.origin) return;
    var d=e.data||{};
    if(d.type!=="aw-preview") return;
    if(Array.isArray(d.hide)){
      PREVIEW.hide=d.hide;
      if(d.bottom!==undefined) PREVIEW.bottom=d.bottom;
      if(state.board&&!state.screen&&!state.rj&&!state.doc){ var y=window.scrollY; render(); window.scrollTo(0,y); }
      if(state.screen&&hiddenSet()[state.screen]){ state.screen=null; render(); }
    }
    if(d.refresh) pvRefresh(true);
  });
}

// 06.11.26 — the buttons the dashboard switched off for this kind of user
// ("אפליקציות" > עריכה). The server sends them with the board; the preview
// takes them from its address.
function hiddenSet(){
  var out={};
  var list = PREVIEW ? PREVIEW.hide : ((state.board&&state.board.hidden)||[]);
  (list||[]).forEach(function(k){ out[k]=true; });
  return out;
}
function render(){
  if(!state.token){ login(); return; }
  if(!state.project){ picker(); return; }
  if(!state.board){ busy(); return; }
  // The signed document, opened inside the app rather than handed to the
  // phone as a file.
  if(state.doc){ viewDoc(); return; }
  if(state.rj){ rjView(); window.scrollTo(0,0); return; }
  // A project manager sees every trade, so he says which one first.
  // 06.11.26 — no separate "choose a trade" page: the home screen opens at
  // once, on his own trade (or the first), and the trades are a row of chips.
  if((state.board.isPm || PREVIEW) && !state.trade){
    state.trade=state.board.trade||TRADES[0].k; loadBoard(); return;
  }
  if(state.screen==="tasks"){ tkView(); return; }
  if(state.screen) screen(); else board();
  window.scrollTo(0,0);
}
function signOut(msg){
  try{ localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(TOKEN_KEY+".projects"); }catch(e){}
  state={ token:null, projects:[], project:null, board:null, screen:null, item:null };
  login(msg);
}
out.onclick=function(){ signOut(); };
window.addEventListener("popstate", function(){
  if(state.doc){ state.doc=null; render(); return; }
  if(state.rj){
    if(state.rj.view==="card"&&state.rj.edit&&state.rj.rowId){ state.rj.edit=false; rjDraft=null; render(); return; }
    if(state.rj.view==="card"){ state.rj.view="list"; state.rj.edit=false; rjDraft=null; render(); return; }
    if(state.rj.view==="list"){ rjLoadLists(); return; }
    state.rj=null; rjDraft=null; render(); return;
  }
  if(state.cat){ state.cat=null; render(); return; }
  if(state.screen==="tasks"&&tkOpen){ tkOpen=null; tkDraft=null; render(); return; }
  if(state.screen){ state.screen=null; tkOpen=null; tkDraft=null; render(); return; }
  if(state.project && state.projects.length>1){ state.project=null; state.board=null; render(); }
});

// A saved token means the phone stays signed in — the grant has no expiry and
// is re-checked by the server on every request anyway.
(function(){
  // 06.11.26 — the dashboard's preview ("אפליקציות"): the home screen as the
  // chosen kind of user sees it, with no sign-in and no data.
  if(PREVIEW){
    document.body.classList.add("isPv");
    out.hidden=true;
    state.token="preview";
    pvStart();
    return;
  }
  var t=null;
  try{ t=localStorage.getItem(TOKEN_KEY); }catch(e){}
  if(!t){ login(); return; }
  state.token=t;
  busy("טוען…");
  // A list saved by an older build carries no logos. It is only there so the
  // screen can be drawn at once; what the server sends below replaces it.
  try{ state.projects=JSON.parse(localStorage.getItem(TOKEN_KEY+".projects")||"[]"); }catch(e){ state.projects=[]; }
  call({action:"projects", token:t}).then(function(r){
    if(r.ok && r.data.projects){
      state.projects=r.data.projects;
      try{ localStorage.setItem(TOKEN_KEY+".projects", JSON.stringify(state.projects)); }catch(e){}
    } else if(r.status===401){
      var why=(r.data&&r.data.error)||"";
      signOut(why==="bad-token"
        ? "ההתחברות השמורה לא זוהתה על ידי השרת (bad-token). התחברו שוב."
        : "ההרשאה כבר לא בתוקף. פנו למנהלת הפרויקט."); return;
    }
    if(!state.projects.length){ retry("השרת לא זמין כרגע."); return; }
    state.project = null;
    render();
  }).catch(function(){
    if(!state.projects.length){ retry("אין חיבור לרשת."); return; }
    state.project = null;
    render();
  });
})();
</script>
