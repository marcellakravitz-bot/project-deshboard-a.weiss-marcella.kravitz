<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>קבלני משנה · א. וייס הנדסה</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17181c; --steel:#5b5e66; --mist:#9a9da5;
    --line:#e6e6e9; --surface:#ffffff; --bg:#f6f6f7;
    --panel:#101114; --helmet:#e8b10a; --ok:#1a7f4b; --navy:#103460; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Assistant','Inter',sans-serif;-webkit-text-size-adjust:100%}
  .num{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
  .bar{position:sticky;top:0;z-index:5;background:var(--panel);color:#fff;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;
    justify-content:center;min-height:52px}
  .bar h1{margin:0;font-size:15px;font-weight:800;letter-spacing:.01em;text-align:center}
  .bar.guest{justify-content:flex-start}
  .bar.guest h1{margin-inline-start:0}
  .bar .side{position:absolute;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:8px}
  .bar .left{left:16px}
  .bar .right{right:16px}
  .bar button{background:none;border:none;color:#b9bcc4;font:inherit;font-size:13px;cursor:pointer;padding:4px}
  .wrap{padding:16px;max-width:560px;margin:0 auto;position:relative}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}
  input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);
    border-radius:10px;background:#fff}
  input:focus-visible,button:focus-visible,.cube:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
  .field+.field{margin-top:14px}
  .go{width:100%;margin-top:18px;padding:13px;border:none;border-radius:999px;background:var(--panel);
    color:#fff;font:inherit;font-weight:800;font-size:15px;cursor:pointer}
  .go[disabled]{background:#c3c6cc}
  .hint{margin:14px 2px 0;font-size:12.5px;color:var(--steel);line-height:1.7;text-align:center}
  .err{margin:12px 0 0;font-size:13px;color:#c0392b}
  .proj{display:flex;flex-direction:column;align-items:center;gap:2px;margin:2px 0 18px;text-align:center}
  .proj img{max-width:150px;max-height:56px;width:auto;height:auto;margin-bottom:8px}
  .proj .pn{font-size:16px;font-weight:800}
  .proj .pf{font-size:13.5px;font-weight:700}
  .proj .pd{font-size:12.5px;color:var(--steel)}
  .proj .ptr{margin-top:6px;font-size:14px;font-weight:800;color:var(--navy)}
  .pushSwitch{display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:16px;font-size:13.5px;font-weight:700;color:var(--navy)}
  .pushSwitch .tiny{border:1px solid var(--line);background:transparent;border-radius:999px;
    padding:3px 10px;font:inherit;font-size:11px;font-weight:700;color:var(--steel);cursor:pointer}
  .tgl{width:46px;height:27px;border-radius:999px;border:none;background:#c9ced6;
    position:relative;cursor:pointer;padding:0;transition:background .18s}
  .tgl span{position:absolute;top:3px;inset-inline-start:3px;width:21px;height:21px;
    border-radius:50%;background:#fff;transition:transform .18s}
  .tgl.on{background:var(--navy)}
  .tgl.on span{transform:translateX(-19px)}
  .backArrow{position:absolute;top:calc(env(safe-area-inset-top) + 14px);inset-inline-end:14px;
    z-index:6;width:38px;height:38px;border:1px solid var(--line);border-radius:12px;
    background:var(--surface);color:var(--steel);display:flex;align-items:center;
    justify-content:center;cursor:pointer;padding:0}
  .backArrow svg{transform:scaleX(-1)}
  .sheet{position:fixed;inset:0;z-index:20;background:rgba(17,18,20,.45);
    display:flex;align-items:flex-end;justify-content:center}
  .sheetCard{background:var(--surface);width:100%;max-width:460px;
    border-radius:18px 18px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 20px);
    text-align:center}
  .sheetCard h3{margin:0 0 8px;font-size:17px}
  .sheetCard p{margin:0 0 18px;font-size:13.5px;color:var(--steel);line-height:1.7}
  .sheetCard .go{margin-top:8px}
  .sheetCard .go.ghost{background:transparent;color:var(--steel);font-weight:600}
  .navBtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;
    padding:7px 14px;font:inherit;font-size:12.5px;font-weight:700;color:var(--steel);cursor:pointer}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .pcube{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    text-align:center;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:18px 14px;min-height:126px;font:inherit;cursor:pointer}
  .pcube img{max-width:110px;max-height:44px;width:auto;height:auto}
  .pcube .t{font-weight:800;font-size:14.5px;color:var(--navy)}
  .pcube .s{font-size:11.5px;color:var(--navy);opacity:.62}
  .lead{margin:2px 2px 14px;text-align:center;font-size:13.5px;color:var(--steel)}
  .rec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:12px}
  .recTop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
  .recTop .num{font-size:12px;color:var(--mist)}
  .rec p{margin:8px 0 0;font-size:13.5px;line-height:1.75;white-space:pre-wrap}
  .rec .stamp{margin-top:10px;font-size:11px;color:var(--mist);font-weight:500}
  .wkNav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px;
    font-size:14px;font-weight:800;color:var(--navy)}
  .wkNav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;
    width:36px;height:36px;font-size:18px;color:var(--steel);cursor:pointer}
  .wkDay{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:10px}
  .wkHead{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;
    font-size:13.5px;color:var(--navy);margin-bottom:8px}
  .wkHead .num{font-size:11.5px;color:var(--mist);font-weight:600}
  .wkDay textarea{width:100%;min-height:72px;font:inherit;font-size:16px;padding:9px;
    border:1px solid var(--line);border-radius:10px;background:#fff;resize:vertical}
  .writeBar{display:flex;justify-content:center;margin-bottom:14px}
  .writeBar button[disabled]{background:#c3c6cc;cursor:default}
  .writeBar button{border:none;border-radius:999px;background:var(--panel);color:#fff;
    font:inherit;font-weight:800;font-size:14px;padding:11px 22px;cursor:pointer}
  .form{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px}
  .form textarea,.form input{width:100%;font:inherit;font-size:16px;padding:10px;
    border:1px solid var(--line);border-radius:10px;background:#fff}
  .form textarea{min-height:110px;resize:vertical}
  .form .row{display:flex;gap:10px}
  .form .row button{flex:1;border:none;border-radius:999px;padding:12px;font:inherit;
    font-weight:800;font-size:15px;color:#fff;background:var(--panel);cursor:pointer}
  .form .row button.ghost{background:#9aa3af}
  .shots{display:flex;flex-wrap:wrap;gap:8px}
  .shots img{width:74px;height:74px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .shots label{width:74px;height:74px;border:1px dashed var(--line);border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--mist);cursor:pointer}
  .files{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .file{display:flex;align-items:center;justify-content:center;width:88px;height:88px;
    border:1px solid var(--line);border-radius:10px;background:#f7f8fa;overflow:hidden;
    font-size:11px;color:var(--steel);text-align:center;padding:6px;text-decoration:none;word-break:break-all}
  .file.img{padding:0}
  .file img{width:100%;height:100%;object-fit:cover}
  .tbl{width:100%;border-collapse:collapse;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .tbl th,.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);font-size:12.5px;text-align:center}
  .tbl thead th{background:#f4f6f9;font-weight:800;font-size:12px}
  .tbl td:nth-child(2){text-align:right}
  .tbl tr:last-child td{border-bottom:none}
  .week th{width:92px;background:#f4f6f9;font-weight:800;text-align:center}
  .week th .num{display:block;font-size:10.5px;color:var(--mist);font-weight:600}
  .week td{text-align:right;white-space:pre-wrap;line-height:1.7}
  .cats{display:flex;flex-direction:column;gap:10px}
  .catRow{display:flex;justify-content:space-between;align-items:center;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;font:inherit;
    font-size:14px;font-weight:800;color:var(--navy);cursor:pointer}
  .catRow .n{font-size:11.5px;font-weight:600;color:var(--mist)}
  .allCats{display:block;margin:0 0 12px}
  .checks{display:flex;flex-direction:column;gap:8px}
  .chk{display:flex;align-items:center;gap:10px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;font-size:13.5px}
  .chk{flex-wrap:wrap}
  .chk .box{flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}
  .chk .txt{flex:1}
  .chk .dt{display:block;font-size:11px;color:var(--mist);font-weight:600;margin-top:2px}
  .chk .ic{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;border:none;background:transparent;color:var(--steel);cursor:pointer;padding:0}
  .chk .ic.off{color:#d3d6dc;cursor:default}
  .chk .noteBox{flex:0 0 100%;margin-top:8px;background:#f7f8fa;border:1px solid var(--line);
    border-radius:8px;padding:10px;font-size:13px;line-height:1.7;white-space:pre-wrap}
  .chk.done .box{background:var(--ok);border-color:var(--ok)}
  .chk.late{background:#fbe3e3;border-color:#f0c9c9}
  .chk.done .txt{color:var(--ok);font-weight:700}
  .eye{display:inline-flex;color:var(--steel)}
  .eye.off{color:#c9ced6}
  .cube{display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;
    text-align:center;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px 14px;min-height:112px;font:inherit;cursor:pointer}
  .cube{position:relative}
  .cube:active{background:#fbfbfc}
  /* New since this phone last looked. It pulses for a few seconds and then
     settles: something that blinks for ever stops being read as a signal. */
  .cube.fresh{border-color:#b9cbe4}
  .cube .dot{position:absolute;top:10px;inset-inline-end:10px;width:10px;height:10px;
    border-radius:50%;background:var(--navy);box-shadow:0 0 0 0 rgba(16,52,96,.45);
    animation:pulse 1.8s ease-out 4}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(16,52,96,.45)}
    70%{box-shadow:0 0 0 9px rgba(16,52,96,0)}
    100%{box-shadow:0 0 0 0 rgba(16,52,96,0)}
  }
  @media (prefers-reduced-motion: reduce){ .cube .dot{animation:none} }
  .cube .ico{width:34px;height:34px;border-radius:10px;background:#eef2f7;display:flex;
    align-items:center;justify-content:center;color:var(--navy)}
  .cube .t{font-weight:800;font-size:14.5px;color:var(--navy)}
  .cube .s{font-size:11.5px;color:var(--navy);opacity:.62;margin-top:-6px}
  .cube .dot{position:absolute}
  .head{position:relative;display:flex;align-items:center;justify-content:center;
    min-height:34px;margin:2px 2px 16px}
  .head h2{margin:0;font-size:16px;font-weight:800}
  .back{position:absolute;inset-inline-start:0;top:50%;transform:translateY(-50%);
    background:none;border:none;font:inherit;font-size:14px;color:var(--steel);cursor:pointer;padding:4px}
  .empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);
    padding:26px 18px;text-align:center;color:var(--steel);font-size:13.5px;line-height:1.8}
  .foot{padding:26px 16px calc(env(safe-area-inset-bottom) + 20px);text-align:center;
    font-size:11px;color:var(--mist)}
  .logo{height:30px;width:auto;display:block}
  .siteFooter{text-align:center;padding:9px 24px calc(env(safe-area-inset-bottom) + 16px);
    font-size:11.5px;color:var(--mist);font-weight:500}
  .buildStamp{display:block;margin-top:3px;font-size:10.5px;color:var(--mist);letter-spacing:.3px}
</style>
</head>

  <span class="side right"><button id="out" hidden>יציאה</button></span>

<main id="app" class="wrap"></main>

<script>

// ---------------------------------------------------------------------------
// Subcontractor app. It holds no data and no rules of its own: it asks
// sub-portal who this phone is and what it may see, and draws the answer.
// The personal code is never checked here — a check in the browser is a check
// anyone can read.
// ---------------------------------------------------------------------------
var API = "https://jvssavyfjuhjniqkiymo.supabase.co/functions/v1/sub-portal";
var TOKEN_KEY = "awsub.token";
var SEEN_KEY = "awsub.seen";
// What this phone has already looked at, per project, per trade, per cube.
// Notifications. Asked for once, after the code is set — never on the very
// first screen, where a permission prompt reads as an ambush. On an iPhone this
// only works at all once the site has been added to the home screen, so a
// refusal there is expected and is not treated as an error. (11.9.26)
var PUSH_KEY="awsub.push";
var PUSH_ASKED="awsub.pushAsked";
// Asked once, over the board, and never again — an offer that returns on every
// visit is an offer nobody reads. Declining leaves the app working exactly as
// before, with the blue dot doing the telling. (11.9.26)
function maybeOfferPush(){
  if(pushReady()) return;
  try { if(localStorage.getItem(PUSH_ASKED)==="1") return; } catch(e){}
  var box=document.createElement("div");
  box.className="sheet";
  box.innerHTML='<div class="sheetCard">'+
    '<h3>התראות לטלפון</h3>'+
    '<p>נודיע לכם כשעולה עדכון חדש בפרויקט, גם כשהאפליקציה סגורה.</p>'+
    '<button class="go" id="pushYes">הפעלת התראות</button>'+
    '<button class="go ghost" id="pushNo">לא עכשיו</button></div>';
  document.body.appendChild(box);
  var close=function(){
    try { localStorage.setItem(PUSH_ASKED,"1"); } catch(e){}
    box.remove();
  };
  box.querySelector("#pushNo").onclick=close;
  box.querySelector("#pushYes").onclick=function(){ close(); askPush(true); };
}
function pushReady(){
  try { return localStorage.getItem(PUSH_KEY)==="1"; } catch(e){ return false; }
}
// Why this can refuse, in the order it usually does: an iPhone in a browser tab
// has no push at all until the site is on the home screen; permission may have
// been denied once and is then never asked again; and a device that agreed
// still has to hand its address to the server. Each of those says so out loud
// now, because "nothing happened" told us nothing. (11.9.26)
function askPush(loud){
  var say=function(m){ if(loud) alert(m); else console.log("[push] "+m); };
  if(!("serviceWorker" in navigator)||!("PushManager" in window)){
    say("המכשיר הזה לא תומך בהתראות. באייפון צריך להוסיף את האתר למסך הבית ולפתוח משם.");
    return;
  }
  if(Notification.permission==="denied"){
    say("ההתראות חסומות בהגדרות הטלפון עבור האתר הזה. צריך לאפשר אותן שם.");
    return;
  }
  navigator.serviceWorker.register("sw.js").then(function(reg){
    return call({action:"vapid"}).then(function(r){
      var key=r.data&&r.data.key;
      if(!key){ say("השרת לא הגדיר מפתח התראות."); return; }
      return Notification.requestPermission().then(function(perm){
        if(perm!=="granted"){ say("לא ניתן אישור להתראות."); return; }
        return reg.pushManager.getSubscription().then(function(existing){
          return existing || reg.pushManager.subscribe({
            userVisibleOnly:true,
            applicationServerKey:urlB64(key)
          });
        }).then(function(sub){
          return call({action:"subscribe", token:state.token,
            projectId:state.project, subscription:sub.toJSON()}).then(function(res){
            if(!res.ok){ say("הרישום בשרת נכשל. "+((res.data&&res.data.detail)||"")); return; }
            try { localStorage.setItem(PUSH_KEY,"1"); } catch(e){}
            say("ההתראות הופעלו.");
            render();
          });
        });
      });
    });
  }).catch(function(e){ say("ההפעלה נכשלה: "+e); });
}
function urlB64(s){
  var pad=(s+"=".repeat((4-s.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/");
  var raw=atob(pad), out=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
  return out;
}
function seenAll(){
  try { return JSON.parse(localStorage.getItem(SEEN_KEY)||"{}"); } catch(e){ return {}; }
}
function seenKey(k){
  return (state.project||"")+"|"+(state.trade||(state.board&&state.board.trade)||"")+"|"+k;
}
function isNew(k){
  var marks=(state.board&&state.board.marks)||{};
  if(!marks[k]) return false;
  return seenAll()[seenKey(k)]!==marks[k];
}
function markSeen(k){
  var marks=(state.board&&state.board.marks)||{};
  if(!marks[k]) return;
  var all=seenAll();
  all[seenKey(k)]=marks[k];
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(all)); } catch(e){}
}

var CUBES = [
  { key:"log",       t:"יומן עדכונים",    s:"מה חדש באתר",   i:"M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM8 12h7M8 16h5" },
  { key:"weekly",    t:"לו״ז שבועי",      s:"עבודות השבוע",  i:"M3 6h18M3 12h18M3 18h18M8 3v18M16 3v18" },
  { key:"submittal", t:"סבמיטלים",        s:"אישורי חומרים", i:"M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9" },
  { key:"sd",        t:"SD",              s:"תוכניות ייצור", i:"M3 21l6-6M14 4l6 6M4 20l3-9 9-3 1 1-3 9-9 3z" },
  { key:"standards", t:"בדיקות מכון התקנים", s:"מה אושר ומה נותר", i:"M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" },
  { key:"specs",     t:"מפרטים מיוחדים",  s:"הנחיות לביצוע", i:"M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM14 3v5h5M9 13h7M9 17h4" }
];
var DECISIONS = {
  approved:      { t:"מאושר",                        c:"#1a7f4b" },
  approvedNoted: { t:"מאושר בכפוף להערות",           c:"#2f7d8f" },
  revise:        { t:"הגשה חדשה בכפוף להערות",       c:"#e08a12" },
  rejected:      { t:"לא מאושר",                     c:"#d02f2f" }
};
var SD_STATUS = {
  required:{t:"נדרש"}, requested:{t:"נתבקש"}, submitted:{t:"הוגש"},
  approved:{t:"מאושר",c:"#1a7f4b"}, approvedNoted:{t:"מאושר בכפוף להערות",c:"#2f7d8f"},
  revise:{t:"להגשה חוזרת",c:"#e08a12"}, rejected:{t:"לא מאושר",c:"#d02f2f"}
};

var CAT_HE = { electrical:"חשמל", lighting:"תאורה", security:"ביטחון, בקרה ותקשורת",

  app.innerHTML =
    '<div class="card">'+
      '<div class="field"><label for="ph">מספר טלפון</label>'+

      '<button class="go" id="in">כניסה</button>'+

      '<p class="hint">בכניסה הראשונה — הקוד שקיבלתם ממנהלת הפרויקט. לאחר שבחרתם קוד משלכם, הזינו אותו.</p>'+
    '</div>';
  var ph=document.getElementById("ph"), cd=document.getElementById("cd");
  var btn=document.getElementById("in");
  btn.onclick=function(){
    if(!ph.value.trim()||!cd.value.trim()){ login("צריך מספר טלפון וקוד."); return; }
    btn.disabled=true; btn.textContent="בודק…";
    call({action:"login", phone:ph.value, code:cd.value}).then(function(r){
      if(!r.ok||!r.data.token){
        var msg = (r.data && r.data.error === "invalid")
          ? "המספר או הקוד לא נמצאו. בדקו מול מנהלת הפרויקט."
          : ("השרת לא זמין כרגע. " + ((r.data && r.data.detail) || ""));
        login(msg); return;
      }
      state.token=r.data.token; state.projects=r.data.projects||[];
      state.needPin=!r.data.hasPin;
      try{
        localStorage.setItem(TOKEN_KEY, state.token);
        localStorage.setItem(TOKEN_KEY+".projects", JSON.stringify(state.projects));
      }catch(e){}
      state.project = null;
      if(state.needPin){ choosePin(); return; }
      render();
    }).catch(function(){ login("אין חיבור לשרת. נסו שוב."); });
  };
}

// and whoever tires of it can stop it. The one-time card still appears on the

  return '<div class="pushSwitch"><span>התראות לטלפון</span>'+
    '<button class="tgl'+(on?" on":"")+'" id="pushTgl" aria-label="התראות"><span></span></button></div>';
}
function turnPushOff(){
  try { localStorage.removeItem(PUSH_KEY); } catch(e){}
  if("serviceWorker" in navigator){
    navigator.serviceWorker.ready.then(function(reg){
      return reg.pushManager.getSubscription().then(function(sub){
        if(!sub) return;
        var ep=sub.endpoint;
        return sub.unsubscribe().then(function(){
          return call({action:"unsubscribe", token:state.token, endpoint:ep});
        });
      });
    }).catch(function(){});
  }
  render();
}

function loadBoard(){

  call({action:"board", token:state.token, projectId:state.project, trade:state.trade}).then(function(r){
    if(r.ok){ state.board=r.data; render(); return; }

// Photographs are shrunk here, before they leave the phone: on site the line
// is thin, and a five-megabyte picture simply never arrives.
function shrink(file){
  return new Promise(function(res){
    if(!file||!/^image\//.test(file.type||"")){ res(null); return; }
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var max=1600, sc=Math.min(1,max/Math.max(img.width,img.height));
      var c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(img.width*sc));
      c.height=Math.max(1,Math.round(img.height*sc));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res({ name:(file.name||"photo")+".jpg", type:"image/jpeg", data:c.toDataURL("image/jpeg",0.82) });
    };
    img.onerror=function(){ URL.revokeObjectURL(url); res(null); };
    img.src=url;
  });
}

function sundayOf(d){
  var x=new Date(d.getTime());
  x.setHours(0,0,0,0);
  x.setDate(x.getDate()-x.getDay());
  return new Date(x.getTime()-x.getTimezoneOffset()*6e4).toISOString().slice(0,10);
}
function shiftWeek(isoDay,weeks){
  var d=new Date(isoDay+"T00:00:00");
  d.setDate(d.getDate()+weeks*7);
  return sundayOf(d);
}
function weekDays(isoDay){
  var names=["ראשון","שני","שלישי","רביעי","חמישי","שישי"];
  var base=new Date(isoDay+"T00:00:00");
  return names.map(function(n,i){
    var d=new Date(base); d.setDate(d.getDate()+i);
    return { name:n, iso:new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10) };
  });
}

// What a project manager sees: one week at a time, six boxes, and a save that
// sends only the days he actually changed — so two people filling different
// days of the same week never write over one another.
function viewWeeklyEdit(b){
  if(!weekShown) weekShown=sundayOf(new Date());
  var stored=(b.weekly||{})[weekShown]||[];
  var days=weekDays(weekShown);
  var val=function(i){
    if(weekBuf&&weekBuf[i]!=null) return weekBuf[i];
    return stored[i]||"";
  };
  var dirty=!!weekBuf&&Object.keys(weekBuf).some(function(i){ return (weekBuf[i]||"")!==(stored[i]||""); });
  return '<div class="wkNav"><button id="wkPrev">‹</button>'+
      '<strong>'+esc(fmt(weekShown))+' – '+esc(fmt(days[5].iso))+'</strong>'+
      '<button id="wkNext">›</button></div>'+
    days.map(function(d,i){
      return '<div class="wkDay"><div class="wkHead">'+d.name+
        '<span class="num">'+esc(fmt(d.iso))+'</span></div>'+
        '<textarea data-d="'+i+'" placeholder="עבודות נדרשות">'+esc(val(i))+'</textarea></div>';
    }).join("")+
    '<div class="writeBar"><button id="wkSave"'+(dirty?"":" disabled")+'>'+(dirty?"שמירה":"נשמר")+'</button></div>';
}
function screen(){
  var c=CUBES.filter(function(x){return x.key===state.screen})[0];
  var b=state.board||{};
  var body =
    state.screen==="log"       ? viewLog(b) :
    state.screen==="specs"     ? viewSpecs(b) :
    state.screen==="submittal" ? viewSubmittal(b) :
    state.screen==="sd"        ? viewSd(b) :
    state.screen==="standards" ? viewStandards(b) :
                                 viewWeekly(b);
  app.innerHTML=projHead(true)+'<div class="head"><button class="back" id="b">→ חזרה</button><h2>'+c.t+'</h2></div>'+body;
  document.getElementById("b").onclick=function(){ history.back(); };
  Array.prototype.forEach.call(app.querySelectorAll(".catRow"), function(el){
    el.onclick=function(){ state.cat=el.getAttribute("data-c"); history.pushState({s:1},""); render(); };
  });
  var ac=document.getElementById("ac");
  if(ac) ac.onclick=function(){ history.back(); };
  Array.prototype.forEach.call(app.querySelectorAll(".wkDay textarea"), function(t){
    t.oninput=function(){
      weekBuf=weekBuf||{};
      weekBuf[t.getAttribute("data-d")]=t.value;
      var sv=document.getElementById("wkSave");
      if(sv){ sv.disabled=false; sv.textContent="שמירה"; }
    };
  });
  var wp=document.getElementById("wkPrev");
  if(wp) wp.onclick=function(){ weekShown=shiftWeek(weekShown,-1); weekBuf=null; render(); };
  var wn=document.getElementById("wkNext");
  if(wn) wn.onclick=function(){ weekShown=shiftWeek(weekShown,1); weekBuf=null; render(); };
  var ws=document.getElementById("wkSave");
  if(ws) ws.onclick=function(){
    var b=state.board||{};
    var stored=(b.weekly||{})[weekShown]||[];
    var changed=Object.keys(weekBuf||{}).filter(function(i){ return (weekBuf[i]||"")!==(stored[i]||""); });
    if(!changed.length) return;
    ws.disabled=true; ws.textContent="שומר…";
    // One request per day, so a day somebody else touched meanwhile is the
    // only thing that could ever clash.
    var chain=Promise.resolve(), failed=false;
    changed.forEach(function(i){
      chain=chain.then(function(){
        return call({action:"set-week", token:state.token, projectId:state.project,
          trade:state.trade||b.trade, weekStart:weekShown, day:Number(i), text:weekBuf[i]||""})
          .then(function(r){ if(!r.ok) failed=true; });
      });
    });
    chain.then(function(){
      if(failed){ ws.disabled=false; ws.textContent="שמירה"; alert("חלק מהשמירה נכשל."); return; }
      weekBuf=null; loadBoard();
    }).catch(function(){ ws.disabled=false; ws.textContent="שמירה"; alert("אין חיבור."); });
  };
  var nl=document.getElementById("newLog");
  if(nl) nl.onclick=function(){ logDraft={subject:"",body:"",photos:[]}; render(); };
  var lc=document.getElementById("lcancel");
  if(lc) lc.onclick=function(){ logDraft=null; render(); };
  var cam=document.getElementById("lcam");
  if(cam) cam.onchange=function(){
    var f=cam.files&&cam.files[0];
    if(!f) return;
    shrink(f).then(function(ph){
      if(!ph) return;
      logDraft.subject=(document.getElementById("lsub")||{}).value||logDraft.subject;
      logDraft.body=(document.getElementById("ltxt")||{}).value||logDraft.body;
      logDraft.photos.push(ph);
      render();
    });
  };
  var ls=document.getElementById("lsave");
  if(ls) ls.onclick=function(){
    var sub=(document.getElementById("lsub")||{}).value||"";
    var txt=(document.getElementById("ltxt")||{}).value||"";
    if(!sub.trim()){ alert("צריך נושא."); return; }
    ls.disabled=true; ls.textContent="שומר…";
    call({action:"add-log", token:state.token, projectId:state.project,
          trade:state.trade||(state.board&&state.board.trade),
          subject:sub, text:txt, photos:logDraft.photos}).then(function(r){
      if(!r.ok){ ls.disabled=false; ls.textContent="שמירה"; alert("השמירה נכשלה."); return; }
      logDraft=null; loadBoard();
    }).catch(function(){ ls.disabled=false; ls.textContent="שמירה"; alert("אין חיבור."); });
  };
  Array.prototype.forEach.call(app.querySelectorAll(".note"), function(el){
    el.onclick=function(){
      var box=document.getElementById("nb"+el.getAttribute("data-n"));
      if(box) box.hidden=!box.hidden;
    };
  });
}

function render(){
  if(!state.token){ login(); return; }
  if(!state.project){ picker(); return; }
  if(!state.board){ busy(); return; }
  // A project manager sees every trade, so he says which one first.
  if(state.board.isPm && !state.trade){ tradePicker(); return; }
  if(state.screen) screen(); else board();
  window.scrollTo(0,0);
}
function signOut(msg){
  try{ localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(TOKEN_KEY+".projects"); }catch(e){}
  state={ token:null, projects:[], project:null, board:null, screen:null, item:null };
  login(msg);
}
out.onclick=function(){ signOut(); };
window.addEventListener("popstate", function(){
  if(state.cat){ state.cat=null; render(); return; }
  if(state.screen){ state.screen=null; render(); return; }
  if(state.board&&state.board.isPm&&state.trade){ state.trade=null; state.board.trade=null; render(); return; }
  if(state.project && state.projects.length>1){ state.project=null; state.board=null; render(); }
});

// A saved token means the phone stays signed in — the grant has no expiry and
// is re-checked by the server on every request anyway.
(function(){
  var t=null;
  try{ t=localStorage.getItem(TOKEN_KEY); }catch(e){}
  if(!t){ login(); return; }
  state.token=t;
  busy("טוען…");
  try{ state.projects=JSON.parse(localStorage.getItem(TOKEN_KEY+".projects")||"[]"); }catch(e){ state.projects=[]; }
  call({action:"projects", token:t}).then(function(r){
    if(r.ok && r.data.projects){
      state.projects=r.data.projects;
      try{ localStorage.setItem(TOKEN_KEY+".projects", JSON.stringify(state.projects)); }catch(e){}
    } else if(r.status===401){
      var why=(r.data&&r.data.error)||"";
      signOut(why==="bad-token"
        ? "ההתחברות השמורה לא זוהתה על ידי השרת (bad-token). התחברו שוב."
        : "ההרשאה כבר לא בתוקף. פנו למנהלת הפרויקט."); return;
    }
    if(!state.projects.length){ retry("השרת לא זמין כרגע."); return; }
    state.project = null;
    render();
  }).catch(function(){
    if(!state.projects.length){ retry("אין חיבור לרשת."); return; }
    state.project = null;
    render();
  });
})();
</script>
</body>
