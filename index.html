  // Persistence shim: the app saves state via window.storage.
  // Backed by localStorage so projects/state survive a page reload in the browser.
  (function () {
    var mem = {};
    window.storage = {
      get: function (key) {
        try {
          var v = localStorage.getItem('awdash-v2:' + key);
          if (v != null) return Promise.resolve({ value: v });
        } catch (e) {}
        return Promise.resolve(Object.prototype.hasOwnProperty.call(mem, key) ? { value: mem[key] } : null);
      },
      set: function (key, value) {
        mem[key] = value;
        try { localStorage.setItem('awdash-v2:' + key, value); } catch (e) {}
        return Promise.resolve(true);
      }
    };
  })();
  // Surface load errors instead of a blank panel.
  window.addEventListener("error", function (e) {
    var b = document.getElementById("bootmsg");
    if (b && !document.getElementById("root").firstChild) {

    }
  });

// Safety: does this contractors value contain at least one *configured* project
// (a project with a name)? Used to refuse overwriting real data with an empty state.
// A single transient failure on one of these rows used to switch auto-save off
// for the rest of the session — which is how edits look saved and are not.
// Retry a few times before giving up on the whole key.
async function loadAppState(key, tries = 3) {
  let lastErr = null;
  for (let i = 0; i < tries; i++) {
    try {
      const { data, error } = await supabase.from("app_state").select("value").eq("key", key).maybeSingle();
      if (error) throw error;
      return data && data.value || null;
    } catch (e) {
      lastErr = e;
      console.warn(`[awdash] load ${key} attempt ${i + 1} failed`, e);
      await new Promise((r) => setTimeout(r, 400 * (i + 1)));
    }
  }
  throw lastErr || new Error(`load ${key} failed`);
}
function awdashHasProjects(val) {
  try {
    return Array.isArray(val) && val.some((c) => Array.isArray(c && c.projects) && c.projects.some((p) => p && p.name));
  } catch (e) {
    return false;
  }
}

var base = `
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

        :root {
          --ink: #17181c;
          --steel: #5b5e66;
          --mist: #9a9da5;
          --line: #e6e6e9;
          --line-soft: #f0f0f2;
          --surface: #ffffff;
          --bg: #f6f6f7;
          --accent: #17181c;
          --accent-ink: #000000;
          --accent-soft: #eceef1;
          --data: #d25a5a;
          --panel: #101114;
          --panel-2: #1c1d22;
          --radius: 14px;
        }
        .appRoot {
          font-family: 'Assistant', 'Inter', sans-serif;
          color: var(--ink);
          background: var(--bg);
          flex: 1;
          position: relative;
          overflow-x: hidden;
          display: flex;
          flex-direction: column;
        }
        * { box-sizing: border-box; }
        .numerals { font-family: 'Inter', sans-serif; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
`;

// src/styles/header.js
var header = `
        /* ---------- Header ---------- */
        .topbar {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 8px 28px;
          border-bottom: 1px solid var(--line);
          background: var(--surface);
          font-family: 'Assistant', 'Inter', sans-serif;
          color: var(--ink);
          box-sizing: border-box;
        }
        /* System Admin is the controlling area \u2014 tint the top bar so it's
           obvious at a glance that you're in admin edit mode. */
        .topbar.adminMode { background: rgba(26, 85, 158, 0.10); border-bottom-color: rgba(26, 85, 158, 0.24); }
        .brand { display: flex; flex-direction: row; align-items: center; gap: 12px; cursor: pointer; }
        .brandMark {
          display: flex; align-items: center; justify-content: center;
          flex-shrink: 0;
        }
        .brandMark.placeholder {
          width: 38px; height: 38px; border-radius: 10px;
          background: #fff; border: 1px solid var(--line);
          color: var(--ink); font-weight: 800; font-size: 15px; letter-spacing: 0.02em;
        }
        .brandMarkImg { max-height: 38px; max-width: 130px; width: auto; height: auto; object-fit: contain; }
        .brandText { display: flex; flex-direction: column; line-height: 1.2; margin-top: 16px; }
        .brandLabel { font-size: 13px; color: var(--mist); font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; }

        .topbarActions { display: flex; align-items: center; gap: 10px; }
        .langToggle {
          display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden;
        }
        .langToggle button {
          border: none; background: transparent; padding: 7px 14px; font-size: 12.5px;
          font-weight: 700; color: var(--mist); cursor: pointer; font-family: 'Inter', sans-serif;
          letter-spacing: 0.03em; transition: all .15s ease;
        }
        .langToggle button.active { background: var(--ink); color: #fff; }

        .iconBtn {
          width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
          background: var(--surface); display: flex; align-items: center; justify-content: center;
          cursor: pointer; color: var(--ink); transition: all .15s ease;
        }
        .iconBtn:hover { border-color: var(--ink); }

        .siteFooter {
          text-align: center; padding: 9px 24px 9px; font-size: 11.5px;
          color: var(--mist); font-weight: 500;
          margin-top: auto; /* always sits on the bottom edge of the page */
        }
`;

// src/lib/boq.js
// -----------------------------------------------------------------------------
// The bill of quantities. Marcella's file numbers every line CC.SS.IIII:
//   08.00.0000  chapter      (מתקני חשמל)
//   08.01.0000  sub-chapter  (כבלים)
//   08.01.0010  item         (a specific cable)
// The Hebrew workbook writes the item with three digits and the English one with
// four — same item, so the three numbers are compared, never the string.
//
// The sub-chapter is also the grouping she asked for: "all the cables as one
// item, ducts by type and not by cross-section". That grouping is already in the
// file; there is nothing to invent.
// -----------------------------------------------------------------------------
var BOQ_NOTE_UNITS = ["הערה", "note", "notes"];
// Sub-chapters that are works or admin, not something anyone orders. Hidden by
// default; every row can be shown or hidden by hand afterwards.
var BOQ_SKIP_SUB = [
  /^\s*כללי/, /^\s*General\b/i,
  /^\s*בדיקות/, /^\s*Tests?\b/i,
  /שירות\s*,?\s*אחריות/, /Service\b.*Warrant/i,
  /אינטגרציה/, /Integration\b/i,
  /עבודות\s*יומיות/, /Incidental\b/i
];
var LLI_STATUSES = [
  { key: "pending", en: "Awaiting", he: "ממתין" },
  { key: "partial", en: "Partly supplied", he: "סופק חלקית" },
  { key: "supplied", en: "Supplied", he: "סופק" }
];
// Which submittal folder a BOQ chapter belongs to. Chapter numbering is a local
// convention, so this is a starting point and not a law.
var BOQ_CHAPTER_CATEGORY = {
  6: "architecture", 7: "plumbing", 8: "electrical", 9: "architecture",
  10: "flooring", 11: "cladding", 12: "architecture", 15: "hvac",
  22: "architecture", 29: "architecture", 30: "architecture"
};
// Lighting lives inside the electrical chapter, in these sub-chapters.
var BOQ_LIGHTING_SUBS = [11, 12, 23];

function boqIsHebrew(v) {
  return /[֐-׿]/.test(String(v || ""));
}
function boqCode(v) {
  const m = String(v == null ? "" : v).trim().match(/^(\d{1,3})\.(\d{1,3})\.(\d{1,4})$/);
  if (!m) return null;
  return { c: Number(m[1]), s: Number(m[2]), i: Number(m[3]) };
}
function boqKey(c, s, i) {
  return `${c}.${s}.${i}`;
}
function boqSubKey(c, s) {
  return `${String(c).padStart(2, "0")}.${String(s).padStart(2, "0")}`;
}
function boqIsNote(unit) {
  const u = String(unit || "").trim().toLowerCase();
  return !u || BOQ_NOTE_UNITS.indexOf(u) >= 0;
}
function boqNum(v) {
  const n = Number(String(v == null ? "" : v).replace(/[^\d.\-]/g, ""));
  return isFinite(n) ? n : 0;
}

// Pull the four columns out of a sheet given as an array of arrays. The code
// column is found from the data itself, so a stray title row above the header
// changes nothing.
function boqRowsFromAoa(aoa) {
  let codeCol = -1;
  for (const row of aoa || []) {
    for (let c = 0; c < (row || []).length; c++) {
      if (boqCode(row[c])) { codeCol = c; break; }
    }
    if (codeCol >= 0) break;
  }
  if (codeCol < 0) return [];
  const out = [];
  for (const row of aoa || []) {
    const code = boqCode((row || [])[codeCol]);
    if (!code) continue;
    out.push({
      ...code,
      desc: String((row[codeCol + 1] == null ? "" : row[codeCol + 1])).trim().replace(/\s+/g, " "),
      unit: String((row[codeCol + 2] == null ? "" : row[codeCol + 2])).trim(),
      qty: row[codeCol + 3] == null || row[codeCol + 3] === "" ? null : boqNum(row[codeCol + 3])
    });
  }
  return out;
}

async function boqReadFile(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX3.read(buf, { type: "array" });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX3.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: "" });
  const rows = boqRowsFromAoa(aoa);
  // The language of the file is decided by the descriptions, not by the file
  // name — either workbook may be uploaded first.
  const hebrew = rows.filter((r) => boqIsHebrew(r.desc)).length;
  return { lang: hebrew > rows.length / 2 ? "he" : "en", rows, sheetName: wb.SheetNames[0] };
}

// One tree from one or two workbooks. Whatever language is missing simply falls
// back to the other, so a single-language BOQ works too.
function boqBuild(sources) {
  const byCode = {};
  (sources || []).forEach((src) => {
    const lang = src.lang === "he" ? "he" : "en";
    (src.rows || []).forEach((r) => {
      const k = boqKey(r.c, r.s, r.i);
      const cur = byCode[k] || { c: r.c, s: r.s, i: r.i, en: "", he: "", unit: "", qty: null };
      if (!cur[lang]) cur[lang] = r.desc;
      if (!cur.unit && r.unit) cur.unit = r.unit;
      if (cur.qty == null && r.qty != null) cur.qty = r.qty;
      byCode[k] = cur;
    });
  });
  const all = Object.keys(byCode).map((k) => byCode[k]);
  const text = (r) => ({ en: r.en || r.he || "", he: r.he || r.en || "" });

  const chapters = [];
  const chapterOf = {};
  all.filter((r) => r.s === 0 && r.i === 0).forEach((r) => {
    // A chapter number can repeat (07 "Plumbing work" then 07 "General"); the
    // first one carries the name.
    if (chapterOf[r.c]) return;
    const t = text(r);
    const ch = { c: r.c, code: String(r.c).padStart(2, "0"), en: t.en, he: t.he, subs: [] };
    chapterOf[r.c] = ch;
    chapters.push(ch);
  });
  const subOf = {};
  all.filter((r) => r.s > 0 && r.i === 0).forEach((r) => {
    const ch = chapterOf[r.c] || (() => {
      const made = { c: r.c, code: String(r.c).padStart(2, "0"), en: "", he: "", subs: [] };
      chapterOf[r.c] = made;
      chapters.push(made);
      return made;
    })();
    const t = text(r);
    const sub = { c: r.c, s: r.s, code: boqSubKey(r.c, r.s), en: t.en, he: t.he, items: [], unit: "", qty: 0 };
    subOf[sub.code] = sub;

  });
  all.filter((r) => r.i > 0).forEach((r) => {
    const sub = subOf[boqSubKey(r.c, r.s)];
    if (!sub) return;
    const t = text(r);
    sub.items.push({ code: `${sub.code}.${String(r.i).padStart(4, "0")}`, en: t.en, he: t.he, unit: r.unit, qty: r.qty });
  });

  // unit. Mixing metres and units into one number would be a lie.
  chapters.forEach((ch) => ch.subs.forEach((sub) => {
    const counts = {};
    sub.items.filter((it) => !boqIsNote(it.unit)).forEach((it) => {
      counts[it.unit] = (counts[it.unit] || 0) + 1;
    });
    const units = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    sub.unit = units[0] || "";
    sub.mixedUnits = units.length > 1;
    sub.qty = sub.items.filter((it) => it.unit === sub.unit).reduce((sum, it) => sum + (it.qty || 0), 0);
    sub.orderable = sub.items.some((it) => !boqIsNote(it.unit)) &&
      !BOQ_SKIP_SUB.some((re) => re.test(sub.he) || re.test(sub.en));
  }));
  chapters.sort((a, b) => a.c - b.c);
  chapters.forEach((ch) => ch.subs.sort((a, b) => a.s - b.s));
  return { chapters, builtAt: new Date().toISOString() };
}

// The units are written in Hebrew in both of her workbooks, so the English view
// translates the handful that appear rather than showing מ"ר to an English reader.
var BOQ_UNITS = {
  "מטר": "m", "מ\"ר": "m²", "מ\"ק": "m³", "יח'": "unit", "יח\u05F3": "unit",
  "קומפ'": "lump", "קומפ\u05F3": "lump", "נק'": "point", "נק\u05F3": "point",
  "הערה": "note", "ש\"ע": "equiv.", "סכום": "sum", "ק\"ג": "kg", "טון": "ton"
};
function boqUnit(unit, lang) {
  const u = String(unit || "").trim();
  if (!u || lang === "he") return u;
  return BOQ_UNITS[u] || u;
}
// "Thermokir or equivalent" means one submittal can cover the lot; a line that
// names a single product without that phrase needs its own.
function boqIsEquivalent(item) {
  const t = `${(item && item.he) || ""} ${(item && item.en) || ""}`;
  return /ש["\u05F4]ע|שווה\s*ערך|ש\.ע\.|or\s+equivalent|or\s+equal|approved\s+equal/i.test(t);
}
function boqCategoryOf(sub) {
  if (sub.c === 8 && BOQ_LIGHTING_SUBS.indexOf(sub.s) >= 0) return "lighting";
  return BOQ_CHAPTER_CATEGORY[sub.c] || null;
}
function boqText(node, lang) {
  return (lang === "he" ? node.he : node.en) || node.en || node.he || "";
}

// src/lib/boq-classify.js
// -----------------------------------------------------------------------------
// Every priced line in the bill of quantities carries up to three flags, and one
// line can carry all three:
//
//   SUBMITTAL — WHAT. Which product, manufacturer, model, colour, certificate.
//   SD        — HOW.  A drawing the supplier or contractor must produce and get
//                     approved before fabricating or building.
//   LLI       — WHEN. In this office the LLI table is the ordering status board:
//                     everything that is actually ordered from a supplier and
//                     tracked until it lands. Long lead items are the subset of
//                     those whose approval + fabrication + delivery threaten the
//                     programme, and they carry an extra "long lead" mark.
//
// An electrical panel is all three. Wall paint is a submittal and nothing else.
// A staircase is an SD. Demolition is none of them.
//
// The classification runs ONCE, when the bill of quantities is uploaded, and is
// stored with it. Local rules settle the obvious lines for free; the rest go to

// removes is cheaper than a missing line she never sees.

  /לוח(ות)?\s*חשמל/, /מדרגות/, /מעקה/, /בהתאמה\s*אישית/, /מותאם\s*אישית/, /חירוץ/,
  /shop\s*drawing/i, /fabricat/i, /custom[- ]made/i, /bespoke/i, /joinery/i, /millwork/i

// mark inside the LLI table, not a separate tab.
var BOQ_RULES_LONGLEAD = [
  /לוח(ות)?\s*חשמל/, /גופ[יה]\s*תאורה/, /יחיד(ה|ות)\s*(מיזוג|טיפול)/, /מזגן/, /צ׳ילר/, /צ'ילר/,
  /AHU/i, /FCU/i, /VRF/i, /VRV/i, /מעלית/, /גנרטור/, /UPS/i, /שנא(י|ים)/, /מיובא/, /יבוא/,
  /דלת(ות)?\s*(אש|אקוסטי|מתכת|פח)/, /מערכת\s*(גילוי|כיבוי|כריזה|בקרה)/

  /^\s*פירוק/, /^\s*הריסה/, /^\s*חציב/, /^\s*ניסור/, /^\s*עבודות\s*יומיות/,
  /^\s*בדיקות/, /^\s*בדיקה\s/, /^\s*הכנה\s/, /^\s*ניקיון/, /^\s*שירות\s*,?\s*אחריות/,

function boqAnyFlag(f) {
  return !!(f && (f.submittal || f.sd || f.lli));
}
// What the local rules can settle without asking anyone. Returns null when the
// line is genuinely uncertain, and that is what gets sent to the model.
function boqRuleFlags(chapterNo, item, subName) {
  const text = `${item.he || ""} ${item.en || ""}`;
  if (boqIsNote(item.unit)) return { ...boqFlagsEmpty(), settled: true, source: "rule" };
  if (BOQ_WORK_CHAPTERS.indexOf(chapterNo) >= 0) return { ...boqFlagsEmpty(), settled: true, source: "rule" };
  // A whole sub-chapter that is admin or works — כללי, בדיקות, שירות ואחריות —
  // routes nowhere, whatever its individual lines say.
  if (subName && BOQ_SKIP_SUB.some((re) => re.test(subName))) {
    return { ...boqFlagsEmpty(), settled: true, source: "rule" };
  }
  if (BOQ_RULES_WORKONLY.some((re) => re.test(text))) return { ...boqFlagsEmpty(), settled: true, source: "rule" };
  const sd = BOQ_RULES_SD.some((re) => re.test(text));
  const longLead = BOQ_RULES_LONGLEAD.some((re) => re.test(text));
  if (sd || longLead) {
    // Anything worth drawing or worth chasing is also worth approving, and a
    // long lead item is by definition something that gets ordered.
    return { submittal: true, sd, lli: longLead, longLead, settled: true, source: "rule" };
  }
  return null;
}

// Everything the model is asked to decide, in the smallest form that still
// carries the meaning: the number, the unit and the description.
// When there is no answer — the service is not deployed, or a batch failed —
// the line is ticked for approval and for ordering. Generous on purpose: a tick
// Marcella removes costs her a click, a missing line costs her an item.
function boqFallbackFlags(source) {
  return { submittal: true, sd: false, lli: true, longLead: false, source };
}
function boqClassifyPayload(rows) {
  return rows.map((r) => ({
    code: r.code,
    unit: r.unit || "",
    text: (r.he || r.en || "").slice(0, 160)
  }));
}
// The model answers either "SDLX" or { f: "SDLX", g: "צנרת פלדה" }. The group
// name is the thing one approval covers: steel pipe in eight diameters is one
// piping specification, not eight submittals.
function boqParseAnswer(raw) {
  if (raw && typeof raw === "object") {
    return { ...boqParseFlagString(raw.f), group: String(raw.g || "").trim() };
  }
  return { ...boqParseFlagString(raw), group: "" };
}
// "SDLX" -> submittal + shop drawing + ordered + long lead.
function boqParseFlagString(s) {
  const v = String(s || "").toUpperCase();
  const longLead = v.indexOf("X") >= 0;
  return {
    submittal: v.indexOf("S") >= 0,
    sd: v.indexOf("D") >= 0,
    // A long lead item is ordered by definition, whatever the model wrote.
    lli: v.indexOf("L") >= 0 || longLead,
    longLead
  };
}

// The whole pass. `ask` is the function that reaches the model; when it is not
// available the rules alone stand and the caller says so.
async function boqClassify(tree, ask, onProgress) {
  const out = {};
  const pending = [];
  (tree.chapters || []).forEach((ch) => {
    ch.subs.forEach((sub) => {
      sub.items.forEach((item) => {
        const ruled = boqRuleFlags(ch.c, item, `${sub.he || ""} ${sub.en || ""}`);
        if (ruled) {
          out[item.code] = { submittal: ruled.submittal, sd: ruled.sd, lli: ruled.lli, longLead: !!ruled.longLead, source: "rule" };
        } else {
          pending.push({ ...item, chapter: ch.c, chapterName: boqText(ch, "he"), subName: boqText(sub, "he") });
        }
      });
    });
  });
  let asked = 0;
  if (ask && pending.length) {
    const BATCH = 80;
    for (let i = 0; i < pending.length; i += BATCH) {
      const batch = pending.slice(i, i + BATCH);
      if (onProgress) onProgress(Math.min(i + batch.length, pending.length), pending.length);
      let answer = null;
      try {
        answer = await ask(boqClassifyPayload(batch));
      } catch (e) {
        console.warn("[awdash] boq classify batch failed", e);
      }
      batch.forEach((item) => {
        const raw = answer && answer[item.code];
        if (raw == null) {
          out[item.code] = boqFallbackFlags("fallback");
          return;
        }
        out[item.code] = { ...boqParseAnswer(raw), source: "ai" };
        asked++;
      });
    }
  } else {
    pending.forEach((item) => {
      out[item.code] = boqFallbackFlags("rules-only");
    });
  }
  return { flags: out, ruled: Object.keys(out).length - pending.length, asked, pending: pending.length };
}

// What the screens read. A hand edit always wins over the automatic pass, and it
// is stored apart so re-uploading the workbook never overwrites a decision.
function boqFlagsOf(auto, overrides, code) {
  const a = (auto || {})[code];
  const o = (overrides || {})[code];
  const group = (o && o.group) || (a && a.group) || "";
  if (o) return { submittal: !!o.submittal, sd: !!o.sd, lli: !!o.lli, longLead: !!o.longLead, group, source: "user" };
  if (a) return { submittal: !!a.submittal, sd: !!a.sd, lli: !!a.lli, longLead: !!a.longLead, group, source: a.source || "auto" };
  return { ...boqFlagsEmpty(), group, source: "none" };
}
// The families inside one sub-chapter: one entry per thing that gets approved
// once. Without a group name from the model a line stands on its own.
function boqGroupsOf(sub, auto, overrides, flagKey) {
  const out = [];
  (sub.items || []).forEach((item) => {
    if (boqIsNote(item.unit)) return;
    const f = boqFlagsOf(auto, overrides, item.code);
    if (flagKey && !f[flagKey]) return;
    const name = f.group || "";
    const key = name || item.code;
    let g = out.find((x) => x.key === key);
    if (!g) {
      g = { key, name, items: [], flags: boqFlagsEmpty() };
      out.push(g);
    }
    g.items.push(item);
    BOQ_FLAG_KEYS.forEach((k) => { if (f[k]) g.flags[k] = true; });
    if (f.longLead) g.flags.longLead = true;
  });
  return out;
}
// A group is in a tab when any of its lines is.
function boqSubFlags(sub, auto, overrides) {
  const acc = boqFlagsEmpty();
  (sub.items || []).forEach((item) => {
    const f = boqFlagsOf(auto, overrides, item.code);
    BOQ_FLAG_KEYS.forEach((k) => { if (f[k]) acc[k] = true; });
  });
  return acc;
}
function boqCountFlags(tree, auto, overrides) {
  const c = { submittal: 0, sd: 0, lli: 0, none: 0, notes: 0, total: 0 };
  (tree && tree.chapters || []).forEach((ch) => ch.subs.forEach((sub) => sub.items.forEach((item) => {
    c.total++;
    if (boqIsNote(item.unit)) { c.notes++; return; }
    const f = boqFlagsOf(auto, overrides, item.code);
    let any = false;
    BOQ_FLAG_KEYS.forEach((k) => { if (f[k]) { c[k]++; any = true; } });
    if (!any) c.none++;
  })));
  return c;
}

// ---------------------------------------------------------------- file storage
// PDFs and images go to Supabase Storage, not into the JSON row — a spec sheet
// is megabytes and the JSON row is rewritten in full on every save.
// If the bucket has not been created yet the upload falls back to an inline
// copy (capped, and flagged in the UI) so the feature still works today.
var SB_INLINE_LIMIT = 2 * 1024 * 1024;
async function sbUploadFile(projectId, submittalId, file) {
  const safe = sanitizeFileNamePart(file.name || "file");
  const path = `${projectId}/${submittalId}/${Date.now()}-${safe}`;
  try {
    const { error } = await supabase.storage.from(SUBMITTAL_BUCKET).upload(path, file, {
      upsert: true,
      contentType: file.type || "application/octet-stream"
    });
    if (error) throw error;
    return { path, inline: false, dataUrl: null };
  } catch (e) {
    console.warn("[awdash] submittal storage upload failed, keeping an inline copy", e);
    if (file.size > SB_INLINE_LIMIT) throw new Error("STORAGE_UNAVAILABLE_AND_TOO_LARGE");
    const dataUrl = await fileToDataUrl(file);
    return { path: null, inline: true, dataUrl };
  }
}
async function sbFileUrl(att) {
  if (!att) return null;
  if (att.inline && att.dataUrl) return att.dataUrl;
  if (!att.path) return null;
  try {
    const { data, error } = await supabase.storage.from(SUBMITTAL_BUCKET).createSignedUrl(att.path, 3600);
    if (error) throw error;
    return data && data.signedUrl || null;
  } catch (e) {
    console.warn("[awdash] could not sign submittal file url", e);
    return null;
  }
}
async function sbRemoveFile(att) {
  if (!att || !att.path) return;
  try {
    await supabase.storage.from(SUBMITTAL_BUCKET).remove([att.path]);
  } catch (e) {
    console.warn("[awdash] could not remove submittal file", e);
  }
}
// Images keep a small inline thumbnail as well, so the form and the printout
// draw instantly and do not depend on a signed URL that expires.
function sbMakeThumb(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 900;
        let w = img.width;
        let hh = img.height;
        if (Math.max(w, hh) > maxDim) {
          const s = maxDim / Math.max(w, hh);
          w = Math.round(w * s);
          hh = Math.round(hh * s);
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = hh;
        canvas.getContext("2d").drawImage(img, 0, 0, w, hh);
        let out;
        try {
          out = canvas.toDataURL("image/jpeg", 0.82);
        } catch (e) {
          out = reader.result;
        }
        resolve(out);
      };
      img.onerror = () => resolve(reader.result);
      img.src = reader.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}
// A signature keeps its transparency, so a scanned stamp sits on the paper
// rather than inside a white box.
function sbMakeSignature(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 700;
        let w = img.width;
        let hh = img.height;
        if (Math.max(w, hh) > maxDim) {
          const sc = maxDim / Math.max(w, hh);
          w = Math.round(w * sc);
          hh = Math.round(hh * sc);
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = hh;
        canvas.getContext("2d").drawImage(img, 0, 0, w, hh);
        let out;
        try {
          out = canvas.toDataURL("image/png");
        } catch (e) {
          out = reader.result;
        }
        resolve(out);
      };
      img.onerror = () => resolve(reader.result);
      img.src = reader.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}
// The text the AI is allowed to read. Extracted in the browser at upload time,
// while the file is still in hand, and kept on the record so a later AI run does
// not have to fetch the PDF again.
var SB_TEXT_CAP = 6e4;
async function sbExtractPdfText(file) {
  try {
    const pdfjsLib = await loadPdfJs();
    const buf = await fileToArrayBuffer(file);
    const doc = await pdfjsLib.getDocument({ data: buf }).promise;
    let out = "";
    const pages = Math.min(doc.numPages, 40);
    for (let i = 1; i <= pages; i++) {
      const page = await doc.getPage(i);
      const content = await page.getTextContent();
      out += content.items.map((it) => it.str).join(" ") + "\n";
      if (out.length > SB_TEXT_CAP) break;
    }
    return out.slice(0, SB_TEXT_CAP);
  } catch (e) {
    console.warn("[awdash] could not read text out of the PDF", e);
    return "";
  }
}

// Render every attached PDF to images, so the printed document is the submittal
// on page one and the specifications it refers to on the pages after it.
// Nothing is stored: the combined document is built at the moment it is asked
// for and lives only in the print window.
var SB_PRINT_PAGE_CAP = 40;
// An attachment with no page list covers the whole file. One that has a list
// covers exactly those pages — that is how a product gets only its own spec.
function sbPagesOf(att, numPages) {
  const list = att && att.pageList;
  if (!Array.isArray(list) || !list.length) {
    return Array.from({ length: numPages }, (_, i) => i + 1);
  }
  return list.map(Number).filter((n) => n >= 1 && n <= numPages).sort((a, b) => a - b);
}
async function sbRenderSpecPages(rec, onProgress) {
  const atts = (rec.attachments || []).filter((a) => !a.type || String(a.type).indexOf("pdf") >= 0);
  if (!atts.length) return [];
  let pdfjsLib;
  try {
    pdfjsLib = await loadPdfJs();
  } catch (e) {
    console.warn("[awdash] no PDF.js, printing without the specs", e);
    return [];
  }
  const out = [];
  for (const att of atts) {
    if (out.length >= SB_PRINT_PAGE_CAP) break;
    let buf = null;
    try {
      if (att.inline && att.dataUrl) {
        buf = await (await fetch(att.dataUrl)).arrayBuffer();
      } else if (att.path) {
        const { data, error } = await supabase.storage.from(SUBMITTAL_BUCKET).download(att.path);
        if (error) throw error;
        buf = await data.arrayBuffer();
      }
    } catch (e) {
      console.warn("[awdash] could not fetch a spec for printing", att.name, e);
      continue;
    }
    if (!buf) continue;
    try {
      const doc = await pdfjsLib.getDocument({ data: buf }).promise;
      const wanted = sbPagesOf(att, doc.numPages);
      for (const i of wanted) {
        if (out.length >= SB_PRINT_PAGE_CAP) break;
        const page = await doc.getPage(i);
        // ~150 DPI against A4 width: readable in print without a huge payload.
        const base = page.getViewport({ scale: 1 });
        const scale = Math.min(1240 / base.width, 3);
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(viewport.width);
        canvas.height = Math.round(viewport.height);
        await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
        out.push({
          label: `${sbNumber(rec.category, rec.seq)} Rev.${rec.rev || 0} · ${att.name} · p.${i}/${doc.numPages}`,
          dataUrl: canvas.toDataURL("image/jpeg", 0.8)
        });
        if (onProgress) onProgress(out.length);
      }
    } catch (e) {
      console.warn("[awdash] could not render a spec for printing", att.name, e);
    }
  }
  return out;
}

// Some specifications carry no text at all — every page is a picture (a scan,
// or a PDF printed by a tool that rasterises everything). There is nothing to
// extract, so the pages themselves are sent and the model reads them by eye.
// Deliberately smaller and fewer than the print render: legible is enough.
var SB_AI_IMAGE_PAGES = 5;
async function sbRenderSpecImages(rec, maxPages) {
  const atts = (rec.attachments || []).filter((a) => !a.type || String(a.type).indexOf("pdf") >= 0);
  if (!atts.length) return [];
  let pdfjsLib;
  try {
    pdfjsLib = await loadPdfJs();
  } catch (e) {
    return [];
  }
  const out = [];
  for (const att of atts) {
    if (out.length >= maxPages) break;
    let buf = null;
    try {
      if (att.inline && att.dataUrl) {
        buf = await (await fetch(att.dataUrl)).arrayBuffer();
      } else if (att.path) {
        const { data, error } = await supabase.storage.from(SUBMITTAL_BUCKET).download(att.path);
        if (error) throw error;
        buf = await data.arrayBuffer();
      }
    } catch (e) {
      continue;
    }
    if (!buf) continue;
    try {
      const doc = await pdfjsLib.getDocument({ data: buf }).promise;
      const wanted = sbPagesOf(att, doc.numPages);
      for (const i of wanted) {
        if (out.length >= maxPages) break;
        const page = await doc.getPage(i);
        const base = page.getViewport({ scale: 1 });
        const viewport = page.getViewport({ scale: Math.min(1000 / base.width, 2) });
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(viewport.width);
        canvas.height = Math.round(viewport.height);
        await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
        out.push({ data: canvas.toDataURL("image/jpeg", 0.72).split(",")[1], file: att.name, page: i });
      }
    } catch (e) {
      console.warn("[awdash] could not rasterise a spec for the AI", att.name, e);
    }
  }

// The window has to be opened inside the click itself or the browser blocks it,
// so it opens on a waiting message and the content is written in once ready.
function sbPrint(rec, lang, brand, signatures) {
  const w = window.open("", "_blank");
  if (!w) return;
  const waiting = lang === "he" ? "\u05de\u05db\u05d9\u05df \u05d0\u05ea \u05d4\u05de\u05e1\u05de\u05da\u2026" : "Preparing the document\u2026";
  w.document.open();
  w.document.write(`<html><head><meta charset="utf-8"></head><body style="font-family:Arial,sans-serif;padding:60px;text-align:center;color:#6b7280"><p id="sbmsg">${sbEsc(waiting)}</p></body></html>`);
  w.document.close();
  (async () => {
    let specPages = [];
    try {
      specPages = await sbRenderSpecPages(rec, (n) => {
        try {
          const el = w.document.getElementById("sbmsg");
          if (el) el.textContent = `${waiting} (${n})`;
        } catch (e) {
        }
      });
    } catch (e) {
      console.warn("[awdash] spec rendering failed", e);
    }
    if (w.closed) return;
    const html = sbBuildPrintHtml(rec, lang, brand, specPages, signatures);
    w.document.open();
    w.document.write(html);
    w.document.close();
    w.focus();
    setTimeout(() => {
      try {
        w.print();
      } catch (e) {
      }
    }, specPages.length ? 1200 : 700);
  })();
}

  const set = (patch) => setD((prev) => ({ ...prev, ...patch }));
  const ro = !canEdit;
  const isHe = lang === "he";
  // The approval block has its own lock: a reviewer who may not touch a single
  // field of the submittal is still the one who signs it.
  const roSign = !(canEdit || canSign);
  useEffect5(() => {
    setD(rec);
  }, [rec.id]);
  // The submission date drives the required approval date: the sheet asks for
  // four days after the day it was filled in.
  const onDateChange = (v) => set({ date: v, requiredApprovalDate: sbAddDays(v, 4) });

  const inS = {
    padding: "7px 9px",
    border: "1px solid var(--line)",
    borderRadius: 7,
    fontSize: 13,
    background: ro ? "#f6f7f9" : "#fff",
    width: "100%",
    fontFamily: "inherit",
    color: "inherit"
  };
  const field = (key, opts) => {
    const o = opts || {};
    return sbH(
      "label",
      { className: "sbField", key },
      sbH("span", { className: "sbFieldLbl" }, L(key)),
      o.list
        ? sbH(
            React15.Fragment,
            null,
            sbH("input", {
              type: "text",
              value: d[key] || "",
              readOnly: ro,
              onChange: (e) => set({ [key]: e.target.value }),
              style: inS,
              list: `sb-list-${key}`
            }),
            sbH(
              "datalist",
              { id: `sb-list-${key}` },
              (o.list || []).map((v) => sbH("option", { key: v, value: v }))
            )
          )
        : sbH("input", {
            type: o.type || "text",
            value: d[key] || "",
            readOnly: ro,
            dir: o.dir,
            onChange: (e) => (o.onChange ? o.onChange(e.target.value) : set({ [key]: e.target.value })),
            style: inS
          })
    );
  };

  // ---- picture -------------------------------------------------------------
  const onPickImage = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    setErr(null);
    setBusy("image");
    try {
      const thumb = await sbMakeThumb(f);
      const up = await sbUploadFile(projectId, d.id, f);
      set({ image: { name: f.name, thumb, path: up.path, inline: up.inline, dataUrl: up.inline ? null : null } });
    } catch (ex) {
      setErr(lang === "he" ? "לא הצלחתי להעלות את התמונה." : "Could not upload the image.");
    } finally {
      setBusy(null);
    }
  };

  // ---- specification PDFs --------------------------------------------------
  const onPickSpec = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if (!files.length) return;
    setErr(null);
    setBusy("spec");
    try {
      const added = [];
      let text = d.specText || "";
      for (const f of files) {
        const up = await sbUploadFile(projectId, d.id, f);
        const att = {
          id: `at-${Date.now()}-${Math.round(Math.random() * 1e4)}`,
          name: f.name,
          size: f.size,
          type: f.type,
          path: up.path,
          inline: up.inline,
          dataUrl: up.inline ? up.dataUrl : null,
          uploadedAt: new Date().toISOString()
        };
        if ((f.type || "").indexOf("pdf") >= 0 && text.length < SB_TEXT_CAP) {
          const t2 = await sbExtractPdfText(f);
          att.chars = (t2 || "").trim().length;
          if (t2) text = `${text}\n\n===== ${f.name} =====\n${t2}`.slice(0, SB_TEXT_CAP);
        }
        added.push(att);
      }
      set({ attachments: [...(d.attachments || []), ...added], specText: text });
    } catch (ex) {
      setErr(
        ex && ex.message === "STORAGE_UNAVAILABLE_AND_TOO_LARGE"
          ? lang === "he"
            ? "אחסון הקבצים עדיין לא הוקם, והקובץ גדול מ‑2MB. ראי את הוראות ההקמה."
            : "File storage is not set up yet and the file is over 2MB. See the setup notes."
          : lang === "he"
            ? "לא הצלחתי להעלות את הקובץ."
            : "Could not upload the file."
      );
    } finally {
      setBusy(null);
    }
  };
  const removeAtt = async (att) => {
    await sbRemoveFile(att);
    set({ attachments: (d.attachments || []).filter((a) => a.id !== att.id) });
  };
  const openAtt = async (att) => {
    const url = await sbFileUrl(att);
    if (url) window.open(url, "_blank");
  };

  // ---- AI ------------------------------------------------------------------
  // The AI is only allowed to read the files uploaded on this submittal. It is
  // not allowed to fill a field from general knowledge — anything it cannot
  // source from the documents comes back as "No information".
  // A product's fields, with everything the material did not state written as
  // "no information" rather than left blank.
  const applyProduct = (pr) => {
    const o = pr || {};
    const pick = (k) => {
      const v = o[k];
      return v && String(v).trim() ? String(v).trim() : sbText(SB_NO_INFO, lang);
    };
    set({
      typeId: d.typeId || pick("typeId"),
      itemDescription: pick("itemDescription"),
      modelCode: pick("modelCode"),
      manufacturer: pick("manufacturer"),
      infoEn: o.infoEn && String(o.infoEn).trim() ? String(o.infoEn).trim() : SB_NO_INFO.en,
      infoHe: o.infoHe && String(o.infoHe).trim() ? String(o.infoHe).trim() : SB_NO_INFO.he,
      docs: o.docs && typeof o.docs === "object" ? { ...d.docs, ...o.docs } : d.docs,
      // Only if the model picked one of ours; anything else is ignored rather
      // than written into the form.
      subCategory: (() => {
        const c = sbSubcatCanon(o.subCategory || "", d.category);
        return sbSubcats(d.category).some((r) => r[0] === c) ? c : d.subCategory || "";
      })(),
      attachments: sbScopeAttachments(d.attachments, o.pages),
      aiFilledAt: new Date().toISOString()
    });
  };
  const runAi = async () => {
    setAiMsg(null);
    setErr(null);
    const gathered = (d.specText || "").trim();
    if (!gathered && !(d.attachments || []).length) {
      setAiMsg(lang === "he" ? "צריך להעלות מפרט PDF קודם — ה‑AI קורא רק ממנו." : "Upload a specification PDF first — the AI reads only from it.");
      return;
    }
    setBusy("ai");
    try {
      // Under 200 characters means the file has no usable text layer. Rather
      // than give up, hand the model the pages as pictures.
      let shots = [];
      if (gathered.length < 200) {
        setAiMsg(L("readingAsImages"));
        shots = await sbRenderSpecImages(d, SB_AI_IMAGE_PAGES);
        if (!shots.length) {
          setAiMsg(`${L("poorText")} (${gathered.length})`);
          setBusy(null);
          return;
        }
      }
      // Which file each page came from, so the model can say "this file does
      // not belong here" by name.
      const manifest = shots.length
        ? Object.values(
            shots.reduce((acc, sh, i) => {
              acc[sh.file] = acc[sh.file] || { name: sh.file, pages: [] };
              acc[sh.file].pages.push(i + 1);
              return acc;
            }, {})
          )
        : (d.attachments || []).map((a) => ({ name: a.name }));
      const { data, error } = await supabase.functions.invoke("submittal-ai", {
        body: {
          specText: shots.length ? "" : d.specText,
          images: shots.map((sh) => sh.data),
          files: manifest,
          category: d.category,
          lang,
          // The catalogue for this discipline. The model may only choose from
          // it, so the field stays a real sub-category and not a free phrase.
          subCategories: sbSubcats(d.category).map((r) => r[0]),
          fields: ["typeId", "itemDescription", "modelCode", "manufacturer", "infoEn", "infoHe", "subCategory"]
        }
      });
      if (error) throw error;
      const out = data || {};
      // One submittal covers one product. If the material describes several,
      // the list comes back and nothing is filled until it is confirmed.
      const products = Array.isArray(out.products) && out.products.length ? out.products : [out];
      // Anything the material carried that belongs to none of these products is
      // named, not silently dropped.
      const unused = (Array.isArray(out.unusedFiles) ? out.unusedFiles : []).filter(Boolean);
      const unusedLine = unused.length
        ? unused.map((n) => `\u00AB${n}\u00BB \u2014 ${L("notRelevant")}`).join("\n")
        : "";
      if (products.length > 1) {
        // A worklist, not a batch: one product at a time, and it leaves the
        // list once its submittal has been sent.
        const queue = products.map((pr, i) => ({
          id: `q-${Date.now()}-${i}`,
          category: d.category,
          product: pr,
          attachments: sbScopeAttachments(d.attachments, pr.pages),
          specText: d.specText || "",
          scope: d.scope || "",
          subCategory: d.subCategory || ""
        }));
        if (onQueueChange) onQueueChange(queue);
        setAiMsg([`${L("foundProducts")} (${products.length}). ${L("worklistHint")}`, unusedLine].filter(Boolean).join("\n"));
      } else {
        applyProduct(products[0]);
        setAiMsg([lang === "he" ? "הטופס מולא מתוך המסמכים שהועלו." : "Filled from the uploaded documents.", unusedLine].filter(Boolean).join("\n"));
      }
    } catch (ex) {
      console.warn("[awdash] submittal-ai not reachable", ex);
      const detail = ex && (ex.message || String(ex)) || "";
      setAiMsg(
        (lang === "he"
          ? "שירות ה‑AI עדיין לא מחובר (הפונקציה submittal-ai). כל השאר עובד — אפשר למלא ידנית."
          : "The AI service is not connected yet (function submittal-ai). Everything else works — fill it in manually.") +
        (detail ? ` — ${detail}` : "")
      );
    } finally {
      setBusy(null);
    }
  };

  const secBar = (key) => sbH("div", { className: "sbSecBar" }, L(key));

  return sbH(
    "div",
    { className: "sbForm", dir: isRTL ? "rtl" : "ltr" },
    // ------- header. Three columns so the number box lands exactly in the
    //         middle whatever the two sides weigh.
    sbH(
      "div",
      { className: "sbFormHead" },
      sbH(
        "div",
        { className: "sbFormHeadSide start" },
        sbH(
          "button",
          { type: "button", className: "loginBack", onClick: onCancel },
          sbH(isRTL ? ArrowRight : ArrowLeft, { size: 14, strokeWidth: 2.4 }),
          " ",
          L("back")
        )
      ),
      sbH(
        "div",
        { className: "sbNoBox" },
        sbH("b", null, L("submittalNo")),
        sbH("span", null, sbNumber(d.category, d.seq)),
        sbH("i", null, `Rev.${d.rev || 0}`)
      ),
      sbH(
        "div",
        { className: "sbFormHeadSide end" },
        ro ? sbH("span", { className: "sbRoTag" }, L("viewOnly")) : null,
        langSwitch || null,
        sbH(
          "button",
          { type: "button", className: "ghostBtn small", title: L("pdfHint"), onClick: () => sbPrint(d, lang, printBrand, userSignatures) },
          sbH(Printer, { size: 14, strokeWidth: 2 }),
          " ",
          L("print")
        )
      )
    ),
    typeof d.fromRev === "number" && !d.sent
      ? sbH("p", { className: "sbRevNote" }, `${L("newVersionNote")} Rev.${d.fromRev} → Rev.${d.rev}`)
      : null,
    err ? sbH("p", { className: "sbErr" }, err) : null,

    // ------- PROJECT INFORMATION
    secBar("projectInfo"),
    sbH(
      "div",
      { className: "sbGrid2" },
      field("projectName"),
      field("date", { type: "date", dir: "ltr", onChange: onDateChange }),
      field("contractor"),
      field("requiredApprovalDate", { type: "date", dir: "ltr" }),
      sbH(
        "label",
        { className: "sbField" },
        sbH("span", { className: "sbFieldLbl" }, L("discipline")),
        sbH("input", {
          type: "text",
          value: (() => {
            const c = SUBMITTAL_CATEGORIES.find((x) => x.key === d.category);
            return c ? sbText(c, lang) : d.discipline || "";
          })(),
          readOnly: true,
          style: { ...inS, background: "#f6f7f9" }
        })
      ),
      field("submittedBy"),
      // Sub-category: picked from the catalogue for this discipline, but still
      // typeable — a product nobody foresaw must not be blocked by a list.
      sbH(
        "label",
        { className: "sbField" },
        sbH("span", { className: "sbFieldLbl" }, L("subCategory")),
        sbH("input", {
          type: "text",
          value: sbSubcatLabel(d.subCategory || d.scope, d.category, lang),
          readOnly: ro,
          onChange: (e) => set({ subCategory: sbSubcatCanon(e.target.value, d.category) }),
          style: inS,
          list: "sb-list-subcat"
        }),
        sbH(
          "datalist",
          { id: "sb-list-subcat" },
          sbSubcats(d.category).map((r) => sbH("option", { key: r[0], value: lang === "he" ? r[1] : r[0] })),
          (scopeOptions || []).map((v) => sbH("option", { key: `x-${v}`, value: v }))
        )
      ),
      field("email", { type: "email", dir: "ltr" })
    ),

    // ------- EQUIPMENT / MATERIAL DETAILS
    secBar("equipment"),
    sbH(
      "div",
      { className: "sbEqWrap" },
      sbH(
        "div",
        { className: "sbEqFields" },
        field("typeId"),
        field("itemDescription"),
        field("modelCode"),
        field("manufacturer")
      ),
      // The picture cube. Clicking it opens the file picker.
      sbH(
        "label",
        { className: `sbImgBox ${ro ? "ro" : ""}` },
        d.image && d.image.thumb
          ? sbH(React15.Fragment, null,
              sbH("img", { src: d.image.thumb, alt: "" }),
              ro
                ? null
                : sbH(
                    "button",
                    {
                      type: "button",
                      className: "sbImgClear",
                      title: L("remove"),
                      onClick: (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        sbRemoveFile(d.image);
                        set({ image: null });
                      }
                    },
                    sbH(X4, { size: 13, strokeWidth: 2.4 })
                  )
            )
          : sbH(
              "span",
              { className: "sbImgEmpty" },
              sbH(ImagePlus, { size: 26, strokeWidth: 1.6 }),
              sbH("span", null, busy === "image" ? "…" : L("addPicture"))
            ),
        ro ? null : sbH("input", { type: "file", accept: "image/*", style: { display: "none" }, onChange: onPickImage })
      )
    ),

    // ------- SUBMITTED DOCUMENTS
    secBar("documents"),
    sbH(
      "div",
      { className: "sbDocs" },
      SB_DOC_ROWS.map((r) =>
        sbH(
          "label",
          { key: r.key, className: "sbDocRow" },
          sbH("input", {
            type: "checkbox",
            checked: !!(d.docs && d.docs[r.key]),
            disabled: ro,
            onChange: (e) => set({ docs: { ...d.docs, [r.key]: e.target.checked } })
          }),
          sbH("span", { className: "sbDocName" }, sbText(r, lang)),
          r.key === "other"
            ? sbH("input", {
                type: "text",
                value: d.otherText || "",
                readOnly: ro,
                placeholder: "…",
                onChange: (e) => set({ otherText: e.target.value }),
                className: "sbDocOther"
              })
            : null
        )
      )
    ),

    // ------- Additional Information. One box, like the printout: it edits the
    //         text for the language the site is in. Switching language shows
    //         the other version, so both still exist on the record.
    secBar("additional"),
    sbH(
      "label",
      { className: "sbField" },
      sbH("span", { className: "sbFieldLbl" }, L(isHe ? "additionalHe" : "additionalEn")),
      sbH("textarea", {
        value: (isHe ? d.infoHe : d.infoEn) || "",
        readOnly: ro,
        dir: isHe ? "rtl" : "ltr",
        rows: 6,
        onChange: (e) => set(isHe ? { infoHe: e.target.value } : { infoEn: e.target.value }),
        style: { ...inS, resize: "vertical" }
      })
    ),

    // ------- REVIEW & APPROVAL — one block, signed by the supervision
    (d.reviews || []).slice(0, 1).map((rv, i) =>
      sbH(
        "div",
        { key: rv.id || i },
        secBar("review"),
        sbH(
          "div",
          { className: "sbReview" },
          sbH(
            "div",
            { className: "sbField" },
            sbH("span", { className: "sbFieldLbl" }, `${L("signature")} — ${L("supervision")}`),
            // The scanned stamp-and-pen of whoever signed, taken from the
            // signature saved on their user record. The typed name and date sit
            // underneath it, small, exactly as they print.
            sbH(
              "div",
              { className: "sbSigBox" },
              sbSignatureOf(userSignatures, rv.signedByEmail)
                ? sbH("img", { src: sbSignatureOf(userSignatures, rv.signedByEmail), alt: "" })
                : sbH("span", { className: "sbSigEmpty" }, rv.signedByEmail ? L("noSignatureOnFile") : "")
            ),
            sbH("input", {
              type: "text",
              value: rv.signature || "",
              readOnly: roSign,
              placeholder: L("signature"),
              onChange: (e) => {
                const next = (d.reviews || []).slice();
                next[i] = { ...rv, signature: e.target.value, signedAt: e.target.value ? new Date().toISOString() : null };
                set({ reviews: next });
              },
              style: inS
            }),
            roSign
              ? null
              : sbH(
                  "div",
                  { className: "sbSigRow" },
                  sbH(
                    "button",
                    {
                      type: "button",
                      className: "sbLinkBtn",
                      onClick: () => {
                        const next = (d.reviews || []).slice();
                        const who = (currentEmail || "").split("@")[0] || currentEmail || "";
                        next[i] = {
                          ...rv,
                          signedByEmail: (currentEmail || "").toLowerCase(),
                          signature: rv.signature || `${who} · ${sbFmtDate(sbToday())}`,
                          signedAt: new Date().toISOString()
                        };
                        set({ reviews: next });
                      }
                    },
                    L("signAsMe")
                  ),
                  rv.signedByEmail
                    ? sbH(
                        "button",
                        {
                          type: "button",
                          className: "sbLinkBtn muted",
                          onClick: () => {
                            const next = (d.reviews || []).slice();
                            next[i] = { ...rv, signedByEmail: null, signature: "", signedAt: null };
                            set({ reviews: next });
                          }
                        },
                        L("clearSignature")
                      )
                    : null
                )
          ),
          sbH(
            "label",
            { className: "sbField" },
            sbH("span", { className: "sbFieldLbl" }, L("approvalComments")),
            sbH("textarea", {
              value: rv.comments || "",
              readOnly: roSign,
              rows: 2,
              onChange: (e) => {
                const next = (d.reviews || []).slice();
                next[i] = { ...rv, comments: e.target.value };
                set({ reviews: next });
              },
              style: { ...inS, resize: "vertical" }
            })
          ),
          sbH(
            "div",
            { className: "sbDecisions" },
            SB_DECISIONS.map((dec) =>
              sbH(
                "label",
                { key: dec.key, className: "sbDecRow" },
                sbH("input", {
                  type: "radio",
                  name: `sb-dec-${d.id}-${i}`,
                  checked: rv.decision === dec.key,
                  disabled: roSign,
                  onChange: () => {
                    const next = (d.reviews || []).slice();
                    const who = (currentEmail || "").split("@")[0] || currentEmail || "";
                    next[i] = {
                      ...rv,
                      decision: dec.key,
                      signedAt: new Date().toISOString(),
                      signedByEmail: rv.signedByEmail || (currentEmail || "").toLowerCase(),
                      signature: rv.signature || `${who} · ${sbFmtDate(sbToday())}`
                    };
                    set({ reviews: next });
                  }
                }),
                sbH("span", { style: { color: dec.color, fontWeight: 700 } }, sbText(dec, lang))
              )
            ),
            ro || !rv.decision
              ? null
              : sbH(
                  "button",
                  {
                    type: "button",
                    className: "sbLinkBtn",
                    onClick: () => {
                      const next = (d.reviews || []).slice();
                      next[i] = { ...rv, decision: null };
                      set({ reviews: next });
                    }
                  },
                  lang === "he" ? "ניקוי" : "Clear"
                )
          )
        )
      )
    ),

    // ------- specification files + AI
    sbH(
      "div",
      { className: "sbSpecs" },
      sbH("div", { className: "sbSpecsHead" }, sbH(FileTextIcon, { size: 15, strokeWidth: 2 }), " ", L("specs")),
      sbH(
        "div",
        { className: "sbSpecsRow" },
        ro
          ? null
          : sbH(
              "label",
              { className: "ghostBtn small", style: { cursor: "pointer", fontFamily: "inherit" } },
              sbH(Upload4, { size: 14, strokeWidth: 2 }),
              " ",
              busy === "spec" ? "…" : L("uploadSpec"),
              sbH("input", {
                type: "file",
                accept: "application/pdf,.pdf",
                multiple: true,
                style: { display: "none" },
                onChange: onPickSpec
              })
            ),
        ro
          ? null
          : sbH(
              "button",
              { type: "button", className: "sbAiBtn", onClick: runAi, disabled: busy === "ai" },
              sbH(Sparkles, { size: 14, strokeWidth: 2 }),
              " ",
              busy === "ai" ? (lang === "he" ? "קורא את המפרטים…" : "Reading the specs…") : L("fillWithAi")
            )
      ),
      sbH("p", { className: "sbAiHint" }, L("aiHint")),
      sbH("p", { className: "sbAiHint" }, L("pdfHint")),
      (d.specText || "").trim()
        ? sbH(
            "button",
            {
              type: "button",
              className: "sbLinkBtn",
              style: { marginTop: 8 },
              onClick: () => {
                const w = window.open("", "_blank");
                if (!w) return;
                w.document.open();
                w.document.write(
                  `<html><head><meta charset="utf-8"><title>spec text</title></head><body style="font-family:monospace;white-space:pre-wrap;padding:24px;line-height:1.5"><p style="font-family:sans-serif;color:#6b7280">${(d.specText || "").length} characters \u2014 this is exactly what the AI receives.</p><hr>${sbEsc(d.specText || "")}</body></html>`
                );
                w.document.close();
              }
            },
            L("showSpecText") + ` (${(d.specText || "").length.toLocaleString()})`
          )
        : null,
      aiMsg ? sbH("p", { className: "sbAiMsg" }, aiMsg) : null,
      sbH(
        "ul",
        { className: "sbAttList" },
        (d.attachments || []).map((att) =>
          sbH(
            "li",
            { key: att.id },
            sbH(
              "button",
              { type: "button", className: "sbLinkBtn", onClick: () => openAtt(att) },
              sbH(FileTextIcon, { size: 13, strokeWidth: 2 }),
              " ",
              att.name
            ),
            typeof att.chars === "number"
              ? sbH(
                  "span",
                  { className: `sbCharsTag ${att.chars < 200 ? "poor" : ""}` },
                  att.chars < 200
                    ? L("noTextTag")
                    : lang === "he" ? `${att.chars.toLocaleString()} תווים` : `${att.chars.toLocaleString()} chars`
                )
              : null,
            att.inline ? sbH("span", { className: "sbInlineTag" }, lang === "he" ? "לא באחסון" : "not in storage") : null,
            ro
              ? null
              : sbH(
                  "button",
                  { type: "button", className: "sbIconBtn", title: L("remove"), onClick: () => removeAtt(att) },
                  sbH(Trash2, { size: 13, strokeWidth: 2 })
                )
          )
        )
      )
    ),

    // ------- the worklist: several products found in one set of specifications
    (queue || []).length
      ? sbH(
          "div",
          { className: "sbProducts" },
          sbH("div", { className: "sbProductsHead" }, `${L("worklist")} — ${(queue || []).length} ${L("remaining")}`),
          sbH("p", { className: "sbAiHint" }, L("worklistHint")),
          sbH(
            "ul",
            { className: "sbProductList" },
            (queue || []).map((q) =>
              sbH(
                "li",
                { key: q.id, className: q.id === d.queueId ? "taken" : "" },
                sbH(
                  "div",
                  { className: "sbProductBody" },
                  sbH("span", { className: "sbProductName" }, q.product.itemDescription || q.product.modelCode || "—"),
                  sbH(
                    "span",
                    { className: "sbProductMeta" },
                    [q.product.manufacturer, q.product.modelCode].filter(Boolean).join(" · "),
                    Array.isArray(q.product.pages) && q.product.pages.length
                      ? ` — ${L("pagesLabel")} ${q.product.pages.join(", ")}`
                      : ""
                  )
                ),
                q.id === d.queueId
                  ? sbH("span", { className: "sbTakenTag" }, L("open"))
                  : ro
                    ? null
                    : sbH(
                        "button",
                        {
                          type: "button",
                          className: "sbActBtn",
                          onClick: () => {
                            applyProduct(q.product);
                            set({ attachments: q.attachments || d.attachments, specText: q.specText || d.specText, queueId: q.id });
                            setAiMsg(null);
                          }
                        },
                        L("loadThis")
                      )
              )
            )
          ),
          ro
            ? null
            : sbH(
                "div",
                { className: "sbProductsRow" },
                sbH(
                  "button",
                  { type: "button", className: "ghostBtn small", onClick: () => onQueueChange && onQueueChange([]) },
                  L("discard")
                )
              )
        )
      : null,

    // ------- save
    ro && canSign
      ? sbH(
          "div",
          { className: "sbSaveRow" },
          sbH("button", { type: "button", className: "functionEditBtn", onClick: () => onSave(d) }, L("saveSignature"))
        )
      : null,
    ro
      ? null
      : sbH(
          "div",
          { className: "sbSaveRow" },
          sbH(
            "button",
            { type: "button", className: "ghostBtn small", onClick: () => onSave({ ...d, sent: false }) },
            L("save")
          ),
          sbH(
            "button",
            { type: "button", className: "functionEditBtn", onClick: () => onSave({ ...d, sent: true, sentAt: d.sentAt || new Date().toISOString() }) },
            L("send")
          )
        )
  );
}
