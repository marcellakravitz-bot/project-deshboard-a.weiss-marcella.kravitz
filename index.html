// The date a submittal actually went out, and the date it came back signed.
function sbSignedAt(rec) {
  const rv = (rec && rec.reviews || [])[0] || {};
  return rv.decision && rv.signedAt ? rv.signedAt : null;
}
function sbIsSigned(rec) {
  return !!sbSignedAt(rec);
}
// "New since I last looked": anything signed after the timestamp this browser
// stored on the previous visit. That is what gets the yellow row.
function sbSeenKey(email) {
  return `submittal-seen:${String(email || "anon").toLowerCase()}`;
}


// src/components/PickPasswordModal.jsx
// -----------------------------------------------------------------------------
// The first sign-in. The invitation gives the address itself as the opening
// password, because a corporate mail filter will often strip the invitation
// link and leave the person with no way in at all. So the link is not the way
// in — it is only a courtesy — and this is where a real password gets chosen.
// It cannot be closed and cannot be skipped.
// -----------------------------------------------------------------------------
function PickPasswordModal({ isRTL, email, onDone }) {
  const [pw, setPw] = useState6("");
  const [pw2, setPw2] = useState6("");
  const [busy, setBusy] = useState6(false);
  const [err, setErr] = useState6(null);
  const t = (he, en) => (isRTL ? he : en);
  const tooShort = pw.length > 0 && pw.length < 8;
  const sameAsEmail = pw.trim().toLowerCase() === String(email || "").trim().toLowerCase();
  const mismatch = pw2.length > 0 && pw !== pw2;
  const ready = pw.length >= 8 && pw === pw2 && !sameAsEmail;

  const save = async () => {
    setErr(null);
    setBusy(true);
    try {
      const { error } = await supabase.auth.updateUser({
        password: pw,
        data: { must_change_password: false, password_set_at: new Date().toISOString() }
      });
      if (error) throw error;
      onDone();
    } catch (e) {
      setErr(e && e.message || t("השמירה נכשלה", "Could not save the password"));
    } finally {
      setBusy(false);
    }
  };

  const field = (label, value, set, auto) =>
    sbH(
      "label",
      { className: "sbField" },
      sbH("span", { className: "sbFieldLbl" }, label),
      sbH("input", {
        type: "password",
        value,
        autoComplete: auto,
        dir: "ltr",
        onChange: (e) => set(e.target.value),
        style: {
          padding: "9px 11px", border: "1px solid var(--line)", borderRadius: 8,
          fontSize: 14, width: "100%", fontFamily: "inherit"
        }
      })
    );

  return createPortal(
    sbH(
      "div",
      { className: "pickPwScrim", dir: isRTL ? "rtl" : "ltr" },
      sbH(
        "div",
        { className: "pickPw" },
        sbH("h3", null, t("בחירת סיסמה", "Choose your password")),
        sbH(
          "p",
          { className: "pickPwHint" },
          t(
            "נכנסת עם כתובת המייל כסיסמה זמנית. בחרי עכשיו סיסמה קבועה — לפחות 8 תווים, ולא כתובת המייל.",
            "You signed in with your address as a temporary password. Choose a permanent one now — at least 8 characters, and not your address."
          )
        ),
        sbH("p", { className: "pickPwEmail", dir: "ltr" }, email || ""),
        field(t("סיסמה חדשה", "New password"), pw, setPw, "new-password"),
        field(t("שוב, לוודא", "Repeat it"), pw2, setPw2, "new-password"),
        tooShort ? sbH("p", { className: "pickPwErr" }, t("לפחות 8 תווים.", "At least 8 characters.")) : null,
        sameAsEmail && pw ? sbH("p", { className: "pickPwErr" }, t("זו הסיסמה הזמנית — צריך אחרת.", "That is the temporary one — pick a different password.")) : null,
        mismatch ? sbH("p", { className: "pickPwErr" }, t("שתי הסיסמאות לא זהות.", "The two do not match.")) : null,
        err ? sbH("p", { className: "pickPwErr" }, err) : null,
        sbH(
          "button",
          { type: "button", className: "functionEditBtn", disabled: !ready || busy, onClick: save },
          busy ? t("שומר…", "Saving…") : t("שמירה והמשך", "Save and continue")
        )
      )
    ),
    document.body
  );
}

// src/components/SignaturePad.jsx
// -----------------------------------------------------------------------------
// A box to sign in, with a mouse or a finger. Pointer events cover both, so
// there is no separate touch path to keep working. What comes out is a PNG with
// a transparent background, trimmed to the ink, so it drops onto the form the
// way a stamp would.
// -----------------------------------------------------------------------------
function SignaturePad({ isRTL, onCancel, onDone }) {
  const canvasRef = useRef5(null);
  const [dirty, setDirty] = useState6(false);
  const t = (he, en) => (isRTL ? he : en);

  useEffect5(() => {
    const c = canvasRef.current;
    if (!c) return;
    // Draw at the device's own resolution, or the line looks like a staircase
    // on a phone and the saved image comes out soft.
    const ratio = window.devicePixelRatio || 1;
    const rect = c.getBoundingClientRect();
    c.width = Math.round(rect.width * ratio);
    c.height = Math.round(rect.height * ratio);
    const ctx = c.getContext("2d");
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#14181f";
  }, []);

  const pos = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  };
  const start = (e) => {
    const c = canvasRef.current;
    const ctx = c.getContext("2d");
    const { x, y } = pos(e);
    ctx.beginPath();
    ctx.moveTo(x, y);
    c.__drawing = true;
    setDirty(true);
    // Capture keeps the stroke alive if the pointer wanders off the box, but a
    // browser that refuses the call must not take the whole stroke with it.
    try {
      if (e.pointerId != null && c.setPointerCapture) c.setPointerCapture(e.pointerId);
    } catch (err) {
      // no capture; drawing still works while the pointer is over the canvas
    }
  };
  const move = (e) => {
    const c = canvasRef.current;
    if (!c || !c.__drawing) return;
    e.preventDefault();
    const ctx = c.getContext("2d");
    const { x, y } = pos(e);
    ctx.lineTo(x, y);
    ctx.stroke();
  };
  const end = (e) => {
    const c = canvasRef.current;
    if (!c) return;
    c.__drawing = false;
    if (e && e.pointerId != null && c.hasPointerCapture && c.hasPointerCapture(e.pointerId)) {
      c.releasePointerCapture(e.pointerId);
    }
  };
  const clear = () => {
    const c = canvasRef.current;
    const ctx = c.getContext("2d");
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.restore();
    setDirty(false);
  };
  // Crop to the ink before saving: a signature drawn in the corner should not
  // arrive on the form as a mostly-empty rectangle.
  const done = () => {
    const c = canvasRef.current;
    const ctx = c.getContext("2d");
    const img = ctx.getImageData(0, 0, c.width, c.height);
    let minX = c.width, minY = c.height, maxX = -1, maxY = -1;
    for (let y = 0; y < c.height; y++) {
      for (let x = 0; x < c.width; x++) {
        if (img.data[(y * c.width + x) * 4 + 3] > 8) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < 0) return;
    const pad = Math.round(6 * (window.devicePixelRatio || 1));
    minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
    maxX = Math.min(c.width - 1, maxX + pad); maxY = Math.min(c.height - 1, maxY + pad);
    const w = maxX - minX + 1;
    const h = maxY - minY + 1;
    const out = document.createElement("canvas");
    out.width = w;
    out.height = h;
    out.getContext("2d").drawImage(c, minX, minY, w, h, 0, 0, w, h);
    // PNG, not JPEG: the background has to stay transparent.
    onDone(out.toDataURL("image/png"));
  };

  // Straight onto the body. The whole app sits inside a scaled box, and
  // `position: fixed` inside a transformed ancestor anchors to that box, not to
  // the window — the pad came out above the top of the screen. Outside .appRoot
  // it inherits neither direction nor font, so both are set here.
  return createPortal(
    sbH(
      "div",
      { className: "sigPadScrim", onClick: onCancel, dir: isRTL ? "rtl" : "ltr" },
      sbH(
        "div",
        { className: "sigPad", onClick: (e) => e.stopPropagation(), dir: isRTL ? "rtl" : "ltr" },
        sbH("div", { className: "sigPadTitle" }, t("חתימה", "Signature")),
        sbH("p", { className: "sigPadHint" }, t("חתמי בתוך המסגרת — בעכבר או באצבע.", "Sign inside the frame — with a mouse or a finger.")),
        sbH("canvas", {
          ref: canvasRef,
          className: "sigCanvas",
          onPointerDown: start,
          onPointerMove: move,
          onPointerUp: end,
          onPointerLeave: end,
          onPointerCancel: end
        }),
        sbH(
          "div",
          { className: "sigPadRow" },
          sbH("button", { type: "button", className: "sbLinkBtn muted", onClick: clear }, t("ניקוי", "Clear")),
          sbH("span", { style: { flex: 1 } }),
          sbH("button", { type: "button", className: "ghostBtn small", onClick: onCancel }, t("ביטול", "Cancel")),
          sbH(
            "button",
            { type: "button", className: "functionEditBtn", disabled: !dirty, onClick: done },
            t("אישור החתימה", "Confirm signature")
          )
        )
      )
    ),
    document.body
  );
}

// src/cards/SubmittalReview.jsx
// -----------------------------------------------------------------------------
// What a client or the main contractor sees when they open a submittal: the
// document exactly as it prints, on screen, and underneath it the decision and
// a place to sign. They never see the editing form — there is nothing here for
// them to change.
// -----------------------------------------------------------------------------
function SubmittalReview({ rec, lang, isRTL, langSwitch, canSign, printBrand, userSignatures, currentEmail, onSave, onCancel }) {
  const L = (k) => sbText(SB_L[k], lang);
  const [d, setD] = useState6(rec);
  const [padOpen, setPadOpen] = useState6(false);
  useEffect5(() => { setD(rec); }, [rec && rec.id]);

  const inS = {
    padding: "7px 9px",
    border: "1px solid var(--line)",
    borderRadius: 7,
    fontSize: 13,
    background: "#fff",
    width: "100%",
    fontFamily: "inherit",
    color: "inherit"
  };
  const rv = (d.reviews || [])[0] || {};
  const setReview = (patch) => {
    const next = (d.reviews || []).slice();
    next[0] = { ...rv, ...patch };
    setD({ ...d, reviews: next });
  };
  // The document is rebuilt from the record on every change, so the moment a
  // decision is ticked or a signature is drawn it is visible in the page above.
  // The same HTML the printer gets, with one screen-only touch: the A4 page is
  // a fixed width, so on a wide screen it would sit against the edge.
  const docHtml = sbBuildPrintHtml(d, lang, printBrand, [], userSignatures).replace(
    "</head>",
    "<style>@media screen{body{display:flex;justify-content:center;background:#f6f6f7}}</style></head>"
  );
  const signed = !!(rv.signatureImage || rv.signedByEmail);

  const applySignature = (dataUrl) => {
    setPadOpen(false);
    const who = (currentEmail || "").split("@")[0] || currentEmail || "";
    setReview({
      signatureImage: dataUrl,
      signedByEmail: (currentEmail || "").toLowerCase(),
      signature: rv.signature || who,
      signedAt: new Date().toISOString()
    });
  };

  return sbH(
    "div",
    { className: "sbReviewPage", dir: isRTL ? "rtl" : "ltr" },
    sbH(
      "div",
      { className: "sbFormHead" },
      sbH(
        "div",
        { className: "sbFormHeadSide start" },
        sbH(
          "button",
          { type: "button", className: "loginBack", onClick: onCancel },
          sbH(isRTL ? ArrowRight : ArrowLeft, { size: 14, strokeWidth: 2.4 }),
          " ",
          L("back")
        )
      ),
      sbH(
        "div",
        { className: "sbNoBox" },
        sbH("b", null, L("submittalNo")),
        sbH("span", null, sbNumber(d.category, d.seq)),
        sbH("i", null, `Rev.${d.rev || 0}`)
      ),
      sbH(
        "div",
        { className: "sbFormHeadSide end" },
        langSwitch || null,
        sbH(
          "button",
          { type: "button", className: "ghostBtn small", title: L("pdfHint"), onClick: () => sbPrint(d, lang, printBrand, userSignatures) },
          sbH(Printer, { size: 14, strokeWidth: 2 }),
          " ",
          L("print")
        )
      )
    ),
    // The document itself. An iframe because it is the very same HTML that goes
    // to the printer — one source, so what is signed on screen and what comes
    // out of the printer cannot drift apart.
    sbH("iframe", { className: "sbDocFrame", title: sbPrintName(d), srcDoc: docHtml }),

    canSign
      ? sbH(
          "div",
          { className: "sbSignPanel" },
          sbH("div", { className: "sbSecBar" }, `${L("review")} · ${L("supervision")}`),
          sbH(
            "div",
            { className: "sbDecisions sbDecRowWide" },
            SB_DECISIONS.map((dec) =>
              sbH(
                "label",
                { key: dec.key, className: "sbDecRow" },
                sbH("input", {
                  type: "radio",
                  name: `sb-rev-${d.id}`,
                  checked: rv.decision === dec.key,
                  onChange: () => setReview({ decision: dec.key })
                }),
                sbH("span", { style: { color: dec.color, fontWeight: 700 } }, sbText(dec, lang))
              )
            )
          ),
          sbH(
            "label",
            { className: "sbField" },
            sbH("span", { className: "sbFieldLbl" }, L("approvalComments")),
            sbH("textarea", {
              value: rv.comments || "",
              rows: 2,
              onChange: (e) => setReview({ comments: e.target.value }),
              style: { ...inS, resize: "vertical" }
            })
          ),
          sbH(
            "div",
            { className: "sbSignRow" },
            signed
              ? sbH(
                  "div",
                  { className: "sbSignedBox" },
                  rv.signatureImage ? sbH("img", { src: rv.signatureImage, alt: "" }) : null,
                  sbH(
                    "div",
                    { className: "sbSignedMeta", dir: "ltr" },
                    sbH("span", null, rv.signedByEmail || ""),
                    sbH("span", null, rv.signedAt ? `${sbFmtDate(rv.signedAt.slice(0, 10))} ${rv.signedAt.slice(11, 16)}` : "")
                  ),
                  sbH(
                    "button",
                    {
                      type: "button",
                      className: "sbLinkBtn muted",
                      onClick: () => setReview({ signatureImage: null, signedByEmail: null, signature: "", signedAt: null })
                    },
                    L("clearSignature")
                  )
                )
              : null,
            sbH(
              "button",
              { type: "button", className: "sbSignBtn", onClick: () => setPadOpen(true) },
              sbH(PenLine, { size: 15, strokeWidth: 2 }),
              " ",
              signed ? L("signAgain") : L("signHere")
            )
          ),
          // Nothing is filed until the decision is made: an unsigned tick means
          // nothing, and a signature with no decision says nothing.
          sbH(
            "div",
            { className: "sbSaveRow" },
            sbH(
              "button",
              {
                type: "button",
                className: "functionEditBtn",
                disabled: !rv.decision || !signed,
                onClick: () => onSave(d)
              },
              L("saveSignature")
            )
          ),
          !rv.decision || !signed
            ? sbH("p", { className: "sbSignHint" }, L("signNeedBoth"))
            : null
        )
      : null,
    padOpen
      ? sbH(SignaturePad, { isRTL, onCancel: () => setPadOpen(false), onDone: applySignature })
      : null
  );
}

function SubmittalFolder({
  category,
  lang,
  isRTL,
  list,
  canEdit,
  canSign,
  seenAt,
  queue,
  onTakeFromQueue,
  onCreate,
  onOpen,
  onPrint,
  onNewRevision,
  onDelete,
  boqData,
  boqFlags
}) {
  const L = (k) => sbText(SB_L[k], lang);
  // Which checklist group is opened out into its BOQ lines.
  const [openChk, setOpenChk] = useState6(null);
  // One line per serial — the latest revision. The earlier ones live behind the
  // little arrow next to it, because that is history, not work in progress.
  const [openFamily, setOpenFamily] = useState6(null);
  const families = (() => {
    const bySeq = {};
    // A draft has not been submitted to anyone. Only the administrator, who is
    // the one writing it, sees it in the list at all.
    (list || [])
      .filter((s) => s.category === category.key)
      .forEach((s) => {
      const k = String(s.seq);
      bySeq[k] = bySeq[k] || [];
      bySeq[k].push(s);
    });
    return Object.keys(bySeq)
      .map((k) => {
        const all = bySeq[k].slice().sort((a, b) => (Number(b.rev) || 0) - (Number(a.rev) || 0));
        return { seq: Number(k), latest: all[0], older: all.slice(1) };
      })
      .sort((a, b) => b.seq - a.seq);
  })();
  const rows = families.flatMap((f) =>
    openFamily === f.seq ? [f.latest, ...f.older] : [f.latest]
  );
  const olderCountOf = (s) => {
    const f = families.find((x) => x.seq === s.seq);
    return f && f.latest.id === s.id ? f.older.length : 0;
  };
  const isOlder = (s) => {
    const f = families.find((x) => x.seq === s.seq);
    return !!(f && f.latest.id !== s.id);
  };
  return sbH(
    "div",
    { className: "submittalPanel", dir: isRTL ? "rtl" : "ltr" },
    sbH(
      "div",
      { className: "submittalPanelHead" },
      sbH(category.icon, { size: 17, strokeWidth: 1.9 }),
      sbH("span", null, sbText(category, lang))
    ),
    canEdit
      ? sbH(
          "div",
          { className: "sbCreateWrap" },
          sbH(
            "button",
            { type: "button", className: "sbCreateBtn", onClick: () => onCreate() },
            sbH(Plus2, { size: 16, strokeWidth: 2.4 }),
            " ",
            L("create")
          )
        )
      : null,
    // What the AI split out of one set of specifications and is still waiting
    // to be done. It empties itself as each one is sent.
    canEdit && (queue || []).length
      ? sbH(
          "div",
          { className: "sbProducts" },
          sbH("div", { className: "sbProductsHead" }, `${L("worklist")} — ${queue.length} ${L("remaining")}`),
          sbH(
            "ul",
            { className: "sbProductList" },
            queue.map((q) =>
              sbH(
                "li",
                { key: q.id },
                sbH(
                  "div",
                  { className: "sbProductBody" },
                  sbH("span", { className: "sbProductName" }, q.product.itemDescription || q.product.modelCode || "—"),
                  sbH(
                    "span",
                    { className: "sbProductMeta" },
                    [q.product.manufacturer, q.product.modelCode].filter(Boolean).join(" · "),
                    Array.isArray(q.product.pages) && q.product.pages.length
                      ? ` — ${L("pagesLabel")} ${q.product.pages.join(", ")}`
                      : ""
                  )
                ),
                sbH(
                  "button",
                  { type: "button", className: "sbActBtn sign", onClick: () => onTakeFromQueue && onTakeFromQueue(q) },
                  sbH(Plus2, { size: 13, strokeWidth: 2.4 }),
                  " ",
                  L("loadThis")
                )
              )
            )
          )
        )
      : null,
    // The checklist: what this discipline owes, straight from the routing table.
    // One row per group; open a row to see the actual lines of the bill of
    // quantities under it, and start a submittal from any of them. A group can
    // carry several submittals, because a group is several products.
    (() => {
      const auto = (boqData || {}).flags || {};
      const groups = (((boqData || {}).chapters) || [])
        .flatMap((ch) => ch.subs)
        .filter((sub) => boqCategoryOf(sub) === category.key && boqSubFlags(sub, auto, boqFlags).submittal);
      const mine = (list || []).filter((s) => s.category === category.key);
      const norm = (x) => String(x || "").toLowerCase().replace(/\s+/g, " ").trim();
      // Attached by the item number the submittal was started from. Records made
      // before the bill of quantities existed still match on an exact
      // sub-category, so nothing that was already filed goes missing.
      const attached = (code, node) => {
        const names = node ? [norm(boqText(node, "en")), norm(boqText(node, "he"))].filter(Boolean) : [];
        return mine.filter((s) => {
          if (s.boqCode) return s.boqCode === code;
          if (!names.length) return false;
          const picked = [

// --------------------------------------------------------------- the card
function SubmittalCard({
  appIsRTL,
  projectName,
  project,
  submittals,
  onChangeSubmittals,
  submittalQueue,
  onChangeQueue,
  viewerRole,
  submittalPerms,
  currentEmail,
  userSignatures,
  brandName,
  contacts,
  contactsCatalog,
  printBrand,
  boqData,
  boqFlags,
  userPerms
}) {
  // The submittal has its own language switch. It starts from the site-wide
  // one and then belongs to this screen: the boxes keep their size, only the
  // direction and the wording change.
  const [langOverride, setLangOverride] = useState6(null);
  const lang = langOverride || (appIsRTL ? "he" : "en");
  const isRTL = lang === "he";
  const [selected, setSelected] = useState6(null);
  const [openId, setOpenId] = useState6(null);
  const [draft, setDraft] = useState6(null);
  const list = submittals || [];
  const label = (c) => sbText(c, lang);
  const chosen = SUBMITTAL_CATEGORIES.find((c) => c.key === selected) || null;
  const L = (k) => sbText(SB_L[k], lang);
  const langSwitch = sbH(
    "div",
    { className: "sbLangRow" },
    sbH(
      "div",
      { className: "sbLangToggle", dir: "ltr" },
      sbH(
        "button",
        { type: "button", className: lang === "en" ? "active" : "", onClick: () => setLangOverride("en") },
        "EN"
      ),
      sbH(
        "button",
        { type: "button", className: lang === "he" ? "active" : "", onClick: () => setLangOverride("he") },
        "HE"
      )
    )
  );

  // Editing a submittal is the system administrator's, full stop. Everyone else
  // opens it, reads it, and — if the project allows their role — signs it.
  const perms = submittalPerms || {};
  const canEdit = viewerRole === "admin";
  // Two gates, and both have to open: the project decides whether this role may
  // sign at all, and the person's own account decides whether they may. An
  // account created before that switch existed has no record, and for those the
  // project setting alone still governs — nobody loses a right they had.
  const projectAllows = (perms[viewerRole] || (viewerRole === "contractor" ? "sign" : "view")) === "sign";
  const myPerms = (userPerms || {})[String(currentEmail || "").trim().toLowerCase()];
  const personAllows = myPerms ? !!myPerms.signSubmittal : true;
  const canSign = canEdit || (projectAllows && personAllows);

  // The yellow marker: what was approved since this browser last opened the
  // folder. Read once, and the clock is pushed forward straight away so the
  // next visit compares against now.
  const seenRef = useRef5(null);
  const [seenAt, setSeenAt] = useState6(null);
  useEffect5(() => {
    let alive = true;
    (async () => {
      const key = sbSeenKey(currentEmail);
      try {
        const got = await window.storage.get(key);
        if (alive && seenRef.current === null) {
          seenRef.current = got && got.value || "";
          setSeenAt(seenRef.current);
        }
      } catch (e) {
        if (alive) setSeenAt("");
      }
      try {
        await window.storage.set(key, new Date().toISOString());
      } catch (e) {
      }
    })();
    return () => {
      alive = false;
    };
  }, [currentEmail]);

  const projectId = project && project.id;
  const pName = (project && project.name) || projectName || "";

  // The contractor line is the company itself. The full row in the contacts tab
  // carries a person, a role and a phone — none of that belongs on the form.
  const contractorName = brandName || (() => {
    const row = (contacts || []).find((r) => r.group === "main");
    if (!row) return "";
    const cat = contactsCatalog || {};
    const fromCatalog = catalogLabel(catalogFind(cat.companies || [], row.companyId), lang);
    return fromCatalog || bilingual(row.company, lang) || "";
  })();

  // Alongside the catalogue, the dropdown also offers anything already typed on
  // this project, so a term she invented once stays consistent afterwards.
  const scopeOptions = Array.from(new Set(list.map((s) => (s.subCategory || s.scope || "").trim()).filter(Boolean)));
  // A draft has not been submitted to anyone. Only the administrator, who is the
  // one writing it, sees it at all — not in the list, not in the count on the
  // tile, not in the checklist.
  const visibleList = canEdit ? list : (list || []).filter((s) => s.sent);

  const commit = (next) => {
    if (onChangeSubmittals) onChangeSubmittals(next);
  };
  // `preset` arrives when the submittal is started from a line of the bill of
  // quantities: it carries the item number it answers and the wording to start
  // from. Started from the button at the top it is empty, and the submittal
  // belongs to no BOQ line at all — which is exactly what that button is for.
  const startCreate = (preset) => {
    const rec = sbNewSubmittal({
      category: chosen.key,
      seq: sbNextSeq(list, chosen.key),
      projectName: pName,
      contractor: contractorName,
      disciplineEn: chosen.en,
      disciplineHe: chosen.he,
      email: currentEmail || "",
      submittedBy: (currentEmail || "").split("@")[0] || ""
    });
    const withPreset = preset
      ? {
          ...rec,
          boqCode: preset.code || "",
          boqText: preset.text || "",
          subCategory: preset.subCategory || rec.subCategory || "",
          // The bill of quantities names the type, not the product. What it
          // says goes in Type ID; the description is for the thing that is
          // actually being offered, and only the person filling it in knows it.
          typeId: preset.text || rec.typeId
        }
      : rec;
    setDraft(withPreset);
    setOpenId(withPreset.id);
  };
  const startRevision = (s) => {
    const rec = {
      ...s,
      id: `sb-${Date.now()}-${Math.round(Math.random() * 1e4)}`,
      rev: sbNextRev(list, s),
      createdAt: new Date().toISOString(),
      date: sbToday(),
      requiredApprovalDate: sbAddDays(sbToday(), 4),
      reviews: sbEmptyReviews(),
      sent: false,
      sentAt: null,
      aiFilledAt: null,
      fromRev: Number(s.rev) || 0
    };
    setDraft(rec);
    setOpenId(rec.id);
  };
  const openExisting = (s) => {
    // A sent submittal is a document that went out. Correcting it is a new
    // version, not a rewrite of what the approver already saw. A draft has not
    // gone anywhere, so it is simply edited.
    if (s.sent && canEdit) {
      startRevision(s);
      return;
    }
    setDraft(s);
    setOpenId(s.id);
  };
  const saveDraft = (rec) => {
    const exists = list.some((s) => s.id === rec.id);
    commit(exists ? list.map((s) => (s.id === rec.id ? rec : s)) : [...list, rec]);
    // Sending is what completes a worklist item. Saving a draft leaves it on
    // the list, because the work is not done yet.
    if (rec.sent && rec.queueId && onChangeQueue) {
      onChangeQueue((submittalQueue || []).filter((q) => q.id !== rec.queueId));
    }
    setDraft(null);
    setOpenId(null);
  };
  const deleteOne = (s) => {
    if (!window.confirm(L("confirmDelete"))) return;
    (s.attachments || []).forEach((a) => sbRemoveFile(a));
    if (s.image) sbRemoveFile(s.image);
    commit(list.filter((x) => x.id !== s.id));
  };

  // While a submittal is open, the whole card is the form — the tiles would
  // only be noise on a page this dense.
  if (openId && draft) {
    // Anyone who is not the administrator gets the finished document, not the
    // editing form. There is nothing on this screen for them to change.
    if (!canEdit) {
      return sbH(SubmittalReview, {
        rec: draft,
        lang,
        isRTL,
        langSwitch,
        canSign,
        printBrand,
        userSignatures,
        currentEmail,
        onSave: saveDraft,
        onCancel: () => {
          setDraft(null);
          setOpenId(null);
        }
      });
    }
    return sbH(SubmittalForm, {
      rec: draft,
      lang,
      isRTL,
      langSwitch,
      canEdit,
      canSign,
      projectId,
      scopeOptions,
      printBrand,
      userSignatures,
      currentEmail,
      queue: (submittalQueue || []).filter((q) => q.category === (chosen ? chosen.key : null)),
      onQueueChange: (next) => {
        const others = (submittalQueue || []).filter((q) => q.category !== (chosen ? chosen.key : null));
        if (onChangeQueue) onChangeQueue([...others, ...next]);
      },
      onSave: saveDraft,
      onCancel: () => {
        setDraft(null);
        setOpenId(null);
      }
    });
  }

  return sbH(
    "div",
    { className: "submittalCard", dir: isRTL ? "rtl" : "ltr" },
    sbH(
      "div",
      { className: "submittalHead" },
      sbH(
        "p",
        { className: "submittalIntro" },
        isRTL ? "בחרו קטגוריה להגשת אישורי חומרים ודגימות." : "Choose a category to submit material and sample approvals."
      )
    ),
    langSwitch,
    sbH(
      "div",
      // The grid keeps a fixed direction so the tiles never jump to the other
      // side of the screen when the language changes. Only the label inside a
      // tile switches direction, and it stays inside its own tile.
      { className: "submittalGrid", dir: "rtl" },
      SUBMITTAL_CATEGORIES.map((c) => {
        const count = visibleList.filter((s) => s.category === c.key).length;
        return sbH(
          "button",
          {
            key: c.key,
            type: "button",
            // Same hover-and-select behaviour as the project board cards.
            className: `dashCard submittalTile ${selected === c.key ? "selected" : ""}`,
            "aria-pressed": selected === c.key,
            onClick: () => setSelected((s) => (s === c.key ? null : c.key))
          },
          sbH("div", { className: "cardIcon" }, sbH(c.icon, { size: 20, strokeWidth: 1.7 })),
          sbH("div", null, sbH("p", { className: "cardTitle", dir: "auto" }, label(c))),
          count ? sbH("span", { className: "sbTileCount" }, count) : null
        );
      })
    ),
    chosen &&
      sbH(SubmittalFolder, {
        category: chosen,
        lang,
        isRTL,
        boqData,
        boqFlags,
        list: visibleList,
        canEdit,
        canSign,
        seenAt,
        queue: (submittalQueue || []).filter((q) => q.category === chosen.key),
        onTakeFromQueue: (q) => {
          const rec = sbNewSubmittal({
            category: chosen.key,
            seq: sbNextSeq(list, chosen.key),
            projectName: pName,
            contractor: contractorName,
            disciplineEn: chosen.en,
            disciplineHe: chosen.he,
            email: currentEmail || "",
            submittedBy: (currentEmail || "").split("@")[0] || ""
          });
          const pr = q.product || {};
          const val = (v, fb) => v && String(v).trim() ? String(v).trim() : fb;
          setDraft({
            ...rec,
            queueId: q.id,
            scope: q.scope || "",
            subCategory: sbSubcatCanon(pr.subCategory || q.subCategory || "", rec.category),
            typeId: val(pr.typeId, sbText(SB_NO_INFO, lang)),
            itemDescription: val(pr.itemDescription, sbText(SB_NO_INFO, lang)),
            modelCode: val(pr.modelCode, sbText(SB_NO_INFO, lang)),
            manufacturer: val(pr.manufacturer, sbText(SB_NO_INFO, lang)),
            infoEn: val(pr.infoEn, SB_NO_INFO.en),
            infoHe: val(pr.infoHe, SB_NO_INFO.he),
            docs: pr.docs && typeof pr.docs === "object" ? { ...rec.docs, ...pr.docs } : rec.docs,
            attachments: q.attachments || [],
            specText: q.specText || "",

        onOpen: openExisting,
        onPrint: (s) => sbPrint(s, lang, printBrand, userSignatures),
        onNewRevision: startRevision,
        onDelete: deleteOne
      })
  );
}

  const submit = async () => {

      if (error) {
        let detail = error.message || (isRTL ? "שגיאה בשליחת ההזמנה" : "Error sending invitation");

function BoqClassifyTable({ isRTL: appIsRTL, tree, overrides, onChange, onClose }) {
  // The window carries its own language, like the submittal and the LLI table.
  const [langOverride, setLangOverride] = useState6(null);
  const lang = langOverride || (appIsRTL ? "he" : "en");
  const isRTL = lang === "he";
  const L = (k) => sbText(BOQ_T[k], lang);
  const auto = (tree || {}).flags || {};
  // Edits live here until Save is pressed, so closing with the X leaves the
  // routing exactly as it was.
  const [draft, setDraft] = useState6(overrides || {});
  const [openCh, setOpenCh] = useState6(null);
  const [onlyFlagged, setOnlyFlagged] = useState6(false);
  const [q, setQ] = useState6("");
  const dirty = JSON.stringify(draft) !== JSON.stringify(overrides || {});

  const needle = q.trim().toLowerCase();
  const matches = (r) => {
    if (onlyFlagged && !boqAnyFlag(boqFlagsOf(auto, draft, r.item.code))) return false;
    if (!needle) return true;
    const f = boqFlagsOf(auto, draft, r.item.code);
    const hay = `${r.item.code} ${r.item.he} ${r.item.en} ${r.sub.he} ${r.sub.en} ${r.ch.he} ${r.ch.en} ${f.group}`.toLowerCase();
    return hay.indexOf(needle) >= 0;
  };
  // Chapter by chapter, each with its own count, so nothing is drawn until it
  // is opened — six hundred rows at once is a slow, unreadable wall.
  const chapters = ((tree || {}).chapters || []).map((ch) => {
    const rows = [];
    ch.subs.forEach((sub) => sub.items.forEach((item) => {
      if (boqIsNote(item.unit)) return;
      const r = { ch, sub, item };
      if (matches(r)) rows.push(r);
    }));
    return { ch, rows };
  }).filter((c) => c.rows.length);
  // A search should land on what it found, without a second click.
  const openKeys = needle ? chapters.map((c) => c.ch.c) : (openCh == null ? [] : [openCh]);

  const counts = boqCountFlags(tree, auto, draft);
  const toggle = (code, key) => {
    const cur = boqFlagsOf(auto, draft, code);
    const next = { submittal: cur.submittal, sd: cur.sd, lli: cur.lli, longLead: cur.longLead, group: cur.group };
    next[key] = !next[key];
    if (key === "longLead" && next.longLead) next.lli = true;
    if (key === "lli" && !next.lli) next.longLead = false;
    setDraft({ ...draft, [code]: next });
  };
  const bulk = (rows, key, value) => {
    const next = { ...draft };
    rows.forEach((r) => {
      const cur = boqFlagsOf(auto, draft, r.item.code);
      const f = { submittal: cur.submittal, sd: cur.sd, lli: cur.lli, longLead: cur.longLead, group: cur.group };
      f[key] = value;
      if (key === "longLead" && value) f.lli = true;
      if (key === "lli" && !value) f.longLead = false;
      next[r.item.code] = f;
    });
    setDraft(next);
  };

  const tick = (code, key, on) =>
    sbH(
      "button",
      { type: "button", className: `boqTick ${on ? "on" : ""} ${key}`, title: L(key), onClick: () => toggle(code, key) },
      on ? "✓" : ""
    );
  const bulkBtns = (rows, key) =>
    sbH(
      "span",
      { className: "boqBulk" },
      sbH("button", { type: "button", title: "✓", onClick: () => bulk(rows, key, true) }, "✓"),
      sbH("button", { type: "button", title: "✗", onClick: () => bulk(rows, key, false) }, "✗")
    );

  return createPortal(
    sbH(
      "div",
      { className: "boqModalScrim", dir: isRTL ? "rtl" : "ltr" },
      sbH(
        "div",
        { className: "boqModal" },
        sbH(
          "div",
          { className: "boqModalHead" },
          // The cross comes first in the markup so that in Hebrew it lands in the
          // top corner nearest the reader — top right — and in English, top left.
          sbH(
            "button",
            { type: "button", className: "boqModalX", title: L("close"), onClick: onClose },
            sbH(X4, { size: 18, strokeWidth: 2.2 })
          ),
          sbH("h3", null, L("title")),
          sbH("input", {
            type: "search",
            className: "boqModalSearch",
            placeholder: L("searchAll"),
            value: q,
            onChange: (e) => setQ(e.target.value)
          }),
          sbH(
            "div",
            { className: "sbLangToggle" },
            sbH("button", { type: "button", className: lang === "en" ? "on" : "", onClick: () => setLangOverride("en") }, "EN"),
            sbH("button", { type: "button", className: lang === "he" ? "on" : "", onClick: () => setLangOverride("he") }, "HE")
          )
        ),
        sbH(
          "div",
          { className: "boqModalBar" },
          sbH("span", { className: "boqHint" }, L("hint")),
          sbH(
            "label",
            { className: "lliShowHidden" },
            sbH("input", { type: "checkbox", checked: onlyFlagged, onChange: (e) => setOnlyFlagged(e.target.checked) }),
            " ",
            L("onlyFlagged")
          ),
          sbH(
            "p",
            { className: "boqCounts" },
            [
              [counts.submittal, L("submittal")],
              [counts.sd, L("sd")],
              [counts.lli, L("lli")],
              [counts.none, L("none")],
              [counts.notes, L("notes")]
            ].map(([n, label]) => sbH("span", { key: label, className: "boqCountPart" }, `${n} ${label}`))
          )
        ),
        sbH(
          "div",
          { className: "boqModalBody" },
          chapters.length === 0
            ? sbH("p", { className: "lliNote" }, L("empty"))
            : chapters.map(({ ch, rows }) => {
                const open = openKeys.indexOf(ch.c) >= 0;
                return sbH(
                  "div",
                  { key: ch.c, className: "boqChap" },
                  sbH(
                    "button",
                    {
                      type: "button",
                      className: `boqChapHead ${open ? "open" : ""}`,
                      onClick: () => setOpenCh(open && openCh === ch.c ? null : ch.c)
                    },
                    sbH(ChevronDown2, { size: 16, strokeWidth: 2.4 }),
                    sbH("span", { className: "boqChapName" }, `${ch.code} · ${boqText(ch, lang)}`),
                    sbH("span", { className: "boqChapCount" }, rows.length)
                  ),
                  open
                    ? sbH(
                        "table",
                        { className: "boqClassTable" },
                        sbH(
                          "thead",
                          null,
                          sbH(
                            "tr",
                            null,
                            sbH("th", { className: "cCode" }, L("code")),
                            sbH("th", { className: "cDesc" }, L("desc")),
                            sbH("th", { className: "cGroup" }, L("group")),
                            sbH("th", { className: "cUnit" }, L("unit")),
                            sbH("th", { className: "cQ" }, L("qty")),
                            ["submittal", "sd", "lli", "longLead"].map((k) =>
                              sbH("th", { key: k, className: `cFlag ${k}` }, sbH("span", null, L(k)), bulkBtns(rows, k))
                            )
                          )
                        ),
                        sbH(
                          "tbody",
                          null,
                          rows.map((r) => {
                            const f = boqFlagsOf(auto, draft, r.item.code);
                            return sbH(
                              "tr",
                              { key: r.item.code, className: f.source === "user" ? "boqRowUser" : "" },
                              sbH(
                                "td",
                                { className: "cCode", dir: "ltr" },
                                sbH("span", { className: "boqRowCode" }, r.item.code),
                                sbH("span", { className: "boqRowSub" }, boqText(r.sub, lang))
                              ),
                              sbH("td", { className: "cDesc" }, boqText(r.item, lang)),
                              // The family this line belongs to. Steel pipe in eight
                              // diameters is one specification, so eight lines carry
                              // one name and the checklist asks for one submittal.
                              sbH(
                                "td",
                                { className: "cGroup" },
                                sbH("input", {
                                  type: "text",
                                  className: "lliIn boqGroupIn",
                                  value: f.group,
                                  placeholder: boqText(r.sub, lang),
                                  onChange: (e) =>
                                    setDraft({
                                      ...draft,
                                      [r.item.code]: {
                                        submittal: f.submittal, sd: f.sd, lli: f.lli, longLead: f.longLead,
                                        group: e.target.value
                                      }
                                    })
                                })
                              ),
                              sbH("td", { className: "cUnit" }, boqUnit(r.item.unit, lang)),
                              sbH("td", { className: "cQ", dir: "ltr" }, r.item.qty == null ? "—" : r.item.qty),
                              sbH("td", { className: "cFlag" }, tick(r.item.code, "submittal", f.submittal)),

                              sbH("td", { className: "cFlag" }, tick(r.item.code, "lli", f.lli)),

function BoqUploadBlock({ isRTL, projectId, boq, onChange, boqData, overrides, onOverridesChange }) {
  const [busy, setBusy] = useState6(false);
  const [tableOpen, setTableOpen] = useState6(false);
  const [stage, setStage] = useState6(null);
  const [err, setErr] = useState6(null);
  const t = (he, en) => (isRTL ? he : en);
  const onFile = async (e) => {
    const picked = Array.from(e.target.files || []);
    e.target.value = "";
    if (!picked.length) return;
    setErr(null);
    setBusy(true);
    try {
      const files = [];
      const parsed = [];
      for (const f of picked) {
        const read = await boqReadFile(f);
        if (!read.rows.length) throw new Error(t(`לא נמצאו סעיפים ב‑${f.name}`, `No priced items found in ${f.name}`));
        const stored = await sbUploadFile(projectId, "boq", f);
        files.push({
          name: f.name,
          size: f.size,
          lang: read.lang,
          lines: read.rows.length,
          path: stored.path || null,
          dataUrl: stored.dataUrl || null,
          uploadedAt: new Date().toISOString()
        });
        parsed.push(read);
      }
      // Both languages can be picked together; whichever is missing simply
      // falls back to the other when the table is drawn.
      const tree = boqBuild(parsed);
      // The classification runs here, once. Local rules settle the obvious
      // lines for nothing; the rest go to the model in batches of eighty.
      setStage(t("מסווג את הסעיפים…", "Classifying the items…"));
      const ask = async (rows) => {
        const { data, error } = await supabase.functions.invoke("submittal-ai", {
          body: { mode: "classify", lines: rows }
        });
        if (error) throw error;
        if (!data || !data.flags) throw new Error(data && data.error || "no_flags");
        return data.flags;
      };
      let aiReached = true;
      const probe = async (rows) => {
        try {
          return await ask(rows);
        } catch (e) {
          aiReached = false;
          throw e;
        }
      };
      const res = await boqClassify(tree, aiReached ? probe : null, (done, total) =>
        setStage(`${t("מסווג את הסעיפים", "Classifying")} ${done}/${total}`));
      onChange({ files, data: tree, flags: res.flags, aiReached, stats: res });
    } catch (ex) {
      setErr(ex && (ex.message || String(ex)) || t("ההעלאה נכשלה", "Upload failed"));
    } finally {
      setBusy(false);
      setStage(null);
    }
  };

      sbH(

        sbH("span", { className: "boqName" }, f.name),
        sbH("span", { className: "boqMeta", dir: "ltr" }, `${f.lang === "he" ? "HE" : "EN"} · ${f.lines} · ${sbFmtDate((f.uploadedAt || "").slice(0, 10))}`),

      : null,
