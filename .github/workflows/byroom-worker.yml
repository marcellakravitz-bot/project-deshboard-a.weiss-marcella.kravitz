# By Room — publish the processing job to Google Cloud Run whenever byroom/worker changes.
# Needs (repo Settings > Secrets and variables > Actions):
#   secret   GCP_SA_KEY                      key of the byroom-deploy service account (from byroom/cloud/setup.sh)
#   variable GCP_PROJECT, GCP_REGION, WORK_BUCKET, ARCHIVE_BUCKET
name: byroom-worker
on:
  push:
    branches: [main]
    paths: ["byroom/worker/**", ".github/workflows/byroom-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.GCP_PROJECT != '' }}
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/byroom/worker:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push the image
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
          docker build -t "$IMAGE" byroom/worker
          docker push "$IMAGE"
      - name: Deploy the job
        run: |
          gcloud run jobs deploy byroom-worker \
            --image "$IMAGE" --region ${{ vars.GCP_REGION }} \
            --cpu 4 --memory 16Gi --task-timeout 3600 --max-retries 0 --tasks 1 \
            --service-account byroom-worker@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com \
            --set-secrets DATABASE_URL=byroom-database-url:latest \
            --set-env-vars WORK_BUCKET=${{ vars.WORK_BUCKET }},ARCHIVE_BUCKET=${{ vars.ARCHIVE_BUCKET }},MODE=parse
